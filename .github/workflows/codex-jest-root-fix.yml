name: Codex Phase A platform navigation closure

on:
  push:
    branches:
      - codex/absolute-final-product-closure-20260908

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout execution branch
        uses: actions/checkout@v4
        with:
          ref: codex/absolute-final-product-closure-20260908
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Restore test/runtime binaries
        run: npm rebuild electron ffmpeg-static @derhuerst/ffprobe-static sharp --foreground-scripts

      - name: Encode platform-specific fresh navigation truth
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/store/appStore.ts')
          text = path.read_text(encoding='utf-8')
          anchor = "export type SidebarMode = 'expanded' | 'compact';\n"
          block = """

          export const PLATFORM_INITIAL_VIEWS = {
            desktop: { currentView: 'player' as ViewType },
            android: { currentView: 'home' as ViewType },
          } as const;

          export function initialViewForPlatform(platform: keyof typeof PLATFORM_INITIAL_VIEWS): ViewType {
            return PLATFORM_INITIAL_VIEWS[platform].currentView;
          }
          """.strip('\n')

          if 'export const PLATFORM_INITIAL_VIEWS' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('appStore: SidebarMode anchor changed')
              text = text.replace(anchor, anchor + '\n' + block + '\n', 1)

          old_default = "      currentView: 'player',"
          new_default = "      currentView: initialViewForPlatform('desktop'),"
          if new_default not in text:
              if text.count(old_default) != 1:
                  raise SystemExit(f'appStore: expected one desktop default anchor, found {text.count(old_default)}')
              text = text.replace(old_default, new_default, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Persist navigation repair before validation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/store/appStore.ts
          if ! git diff --cached --quiet; then
            git commit -m "fix(shell): preserve desktop player and Android home defaults"
            git push origin HEAD:codex/absolute-final-product-closure-20260908
          fi

      - name: TypeScript gate
        run: npm run typecheck

      - name: ESLint gate
        run: npm run lint -- --max-warnings=0

      - name: Jest gate
        id: jest
        shell: bash
        run: |
          set +e
          npm test -- --runInBand 2>&1 | tee /tmp/jest.log
          status=${PIPESTATUS[0]}
          cp /tmp/jest.log jest-full.log
          exit "$status"

      - name: Upload Jest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-phase-a-final-jest
          path: jest-full.log
          if-no-files-found: warn
          retention-days: 1
