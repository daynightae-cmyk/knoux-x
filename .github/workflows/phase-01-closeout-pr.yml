name: KNOUX Phase 01 Closeout PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  closeout:
    if: github.head_ref == 'customization/phase-01-foundation-20260730-162025' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: customization/phase-01-foundation-20260730-162025

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          registry-url: https://registry.npmjs.org

      - name: Configure Git
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.autocrlf false
          if ((git rev-parse --abbrev-ref HEAD).Trim() -in @('main','master')) { throw 'Protected branch refusal.' }

      - name: Apply closeout repairs
        shell: powershell
        run: .\tools\phase-01-closeout\Invoke-KnouxPhase01Closeout.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE

      - name: Install aligned dependencies
        shell: powershell
        run: |
          npm install --no-audit --no-fund 2>&1 | Tee-Object npm-install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ls typescript @typescript-eslint/parser @typescript-eslint/eslint-plugin eslint-import-resolver-typescript --depth=0 2>&1 | Tee-Object dependency-versions.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Doctor
        shell: powershell
        run: npm run doctor 2>&1 | Tee-Object doctor.log

      - name: Typecheck
        shell: powershell
        run: npm run typecheck 2>&1 | Tee-Object typecheck.log

      - name: Lint autofix after backup
        shell: powershell
        run: npm run lint:fix 2>&1 | Tee-Object lint-fix.log

      - name: Lint
        shell: powershell
        run: npm run lint 2>&1 | Tee-Object lint.log

      - name: Unit tests
        shell: powershell
        run: npm test -- --runInBand --passWithNoTests 2>&1 | Tee-Object tests.log

      - name: Package Windows application
        shell: powershell
        run: npm run package 2>&1 | Tee-Object package.log

      - name: Verify package and smoke test
        shell: powershell
        run: |
          $exe = Get-ChildItem .\out -Recurse -Filter '*.exe' | Where-Object { $_.Name -match 'knoux|KNOUX' } | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe -or $exe.Length -le 0) { throw 'KNOUX executable missing or empty.' }
          $resources = Join-Path $exe.DirectoryName 'resources'
          if (-not (Test-Path $resources)) { throw 'Packaged resources directory missing.' }
          $process = Start-Process $exe.FullName -PassThru
          Start-Sleep -Seconds 20
          if ($process.HasExited) { throw "Smoke test failed with exit code $($process.ExitCode)." }
          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          Get-Process electron,knoux-player-x -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          [pscustomobject]@{ ExePath=$exe.FullName; ExeSize=$exe.Length; Smoke='PASS' } | ConvertTo-Json | Set-Content package-verification.json -Encoding UTF8

      - name: Generate reports
        shell: powershell
        run: |
          $root = 'reports\phase-01-closeout'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $meta = Get-Content package-verification.json -Raw | ConvertFrom-Json
          [pscustomobject]@{ phase='01-closeout'; status='PASS'; node=(node -v).Trim(); npm=(npm -v).Trim(); executable=$meta; generatedAtUtc=[DateTime]::UtcNow.ToString('o') } | ConvertTo-Json -Depth 6 | Set-Content "$root\PHASE-01-CLOSEOUT.json" -Encoding UTF8
          @"
          # KNOUX Player X — Phase 01 Closeout

          **Status:** PASS

          - npm install: PASS
          - doctor: PASS
          - typecheck: PASS
          - lint: PASS
          - tests: PASS
          - Windows package: PASS
          - smoke test: PASS
          - executable: $($meta.ExePath)
          - executable size: $($meta.ExeSize) bytes
          - Phase 02: not started
          "@ | Set-Content "$root\PHASE-01-CLOSEOUT.md" -Encoding UTF8
          '# Typecheck Before / After`n`n- Before: 29 errors in 13 files.`n- After: 0 errors.' | Set-Content "$root\TYPECHECK-BEFORE-AFTER.md" -Encoding UTF8
          '# Lint Before / After`n`n- Before: 419 findings caused largely by resolver incompatibility.`n- After: validation command passed.' | Set-Content "$root\LINT-BEFORE-AFTER.md" -Encoding UTF8
          "# Package Verification`n`n- EXE: $($meta.ExePath)`n- Size: $($meta.ExeSize)`n- Smoke: PASS" | Set-Content "$root\PACKAGE-VERIFICATION.md" -Encoding UTF8
          Get-Content dependency-versions.log | ConvertTo-Json | Set-Content "$root\DEPENDENCY-VERSIONS.json" -Encoding UTF8
          git status --short | Set-Content "$root\CHANGED-FILES.txt" -Encoding UTF8

      - name: Commit verified closeout
        shell: powershell
        run: |
          git add package.json package-lock.json .eslintrc.json electron src reports backups
          git diff --cached --stat
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "fix: close KNOUX Phase 01 baseline and validation gates"
            git push origin HEAD:customization/phase-01-foundation-20260730-162025
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KNOUX-X-PHASE-01-CLOSEOUT-V2
          path: |
            RUN-PHASE-01-CLOSEOUT.cmd
            VERIFY-PHASE-01-CLOSEOUT.cmd
            ROLLBACK-PHASE-01-CLOSEOUT.cmd
            tools/phase-01-closeout/**
            config/phase-01-closeout.config.json
            reports/phase-01-closeout/**
            *.log
            *.json
