name: KNOUX Full Rebuild Windows

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, codex/knoux-player-x-full-rebuild]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-rebuild-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-package:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate historical quality repairs are committed
        shell: pwsh
        run: |
          if (Test-Path tools/fix-final-quality-gates.cjs) {
            node tools/fix-final-quality-gates.cjs
            if ($LASTEXITCODE -ne 0) { throw 'Historical quality repair validation failed.' }
          } else {
            Write-Host 'No historical quality repair validator.'
          }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) {
            throw 'Quality repair validation modified committed source.'
          }

      - name: Configure native toolchain
        shell: pwsh
        run: |
          $python = (Get-Command python -ErrorAction Stop).Source
          "npm_config_python=$python" >> $env:GITHUB_ENV
          "npm_config_msvs_version=2022" >> $env:GITHUB_ENV
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'MSVC 2022 x64 build tools are missing.' }

      - name: Require committed deterministic lockfile
        shell: pwsh
        run: |
          if (-not (Test-Path package-lock.json) -or (Get-Item package-lock.json).Length -le 0) {
            throw 'Committed package-lock.json is missing or empty.'
          }

      - name: Install deterministic dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate and validate KNOUX icon system
        shell: pwsh
        run: |
          node tools/generate-icon-assets.cjs
          if ($LASTEXITCODE -ne 0) { throw 'KNOUX icon generation failed.' }
          $required = @(
            'assets/icons/app-icon.ico',
            'assets/icons/app-icon.png',
            'assets/icons/tray-icon.png',
            'assets/icons/favicon.png',
            'assets/icons/file-video.ico',
            'assets/icons/file-audio.ico',
            'assets/icons/file-subtitle.ico',
            'assets/icons/file-playlist.ico',
            'assets/icons/file-project.ico'
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file) -or (Get-Item $file).Length -le 0) { throw "Missing or empty icon: $file" }
          }
          git diff --exit-code -- assets/icons
          if ($LASTEXITCODE -ne 0) { throw 'Committed icon assets are not reproducible from the generator.' }

      - name: Validate official KNOUX branding and installer slides
        shell: pwsh
        run: |
          npm run brand:verify
          if ($LASTEXITCODE -ne 0) { throw 'Official KNOUX brand asset validation failed.' }

      - name: Rebuild Electron native modules
        shell: pwsh
        run: |
          npm exec electron-rebuild -- -f --only better-sqlite3,sharp
          if ($LASTEXITCODE -ne 0) { throw 'Electron native-module rebuild failed.' }

      - name: Validate dependency graph
        run: npm ls better-sqlite3 sharp onnxruntime-node --depth=0

      - name: Quality gates
        shell: pwsh
        run: |
          npm run doctor
          if ($LASTEXITCODE -ne 0) { throw 'Doctor gate failed.' }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'TypeScript gate failed.' }
          npm run lint -- --max-warnings=0
          if ($LASTEXITCODE -ne 0) { throw 'ESLint zero-warning gate failed.' }
          npm test -- --runInBand
          if ($LASTEXITCODE -ne 0) { throw 'Jest gate failed.' }

      - name: Package and make Squirrel installer
        shell: pwsh
        run: |
          npm run package -- --arch=x64
          npm run make -- --arch=x64

      - name: Build bilingual nine-slide visual installer
        shell: pwsh
        run: |
          $squirrelCandidates = @(Get-ChildItem 'out\make\squirrel.windows\x64' -File -Filter '*Setup.exe')
          if ($squirrelCandidates.Count -ne 1) {
            throw "Expected exactly one Squirrel Setup.exe payload; found $($squirrelCandidates.Count)."
          }
          $squirrelSetup = $squirrelCandidates[0]
          if ($squirrelSetup.Length -le 1MB) { throw 'Squirrel Setup.exe payload is unexpectedly small.' }

          $visualDirectory = Join-Path $PWD 'out\make\visual.windows\x64'
          $visualInstaller = Join-Path $visualDirectory 'KNOUX-Player-X-Visual-Installer.exe'
          $evidenceDirectory = Join-Path $PWD 'out\visual-installer-evidence'
          New-Item -ItemType Directory -Path $evidenceDirectory -Force | Out-Null
          $selfTestEvidence = Join-Path $evidenceDirectory 'self-test.json'

          & .\tools\build-visual-installer.ps1 `
            -SetupPath $squirrelSetup.FullName `
            -OutputPath $visualInstaller `
            -EvidencePath $selfTestEvidence
          if ($LASTEXITCODE -ne 0) { throw 'Visual installer build or self-test failed.' }
          if (-not (Test-Path $visualInstaller) -or (Get-Item $visualInstaller).Length -le $squirrelSetup.Length) {
            throw 'Visual installer is missing or does not contain the embedded payload.'
          }

          "KNOUX_SQUIRREL_SETUP=$($squirrelSetup.FullName)" >> $env:GITHUB_ENV
          "KNOUX_VISUAL_INSTALLER=$visualInstaller" >> $env:GITHUB_ENV
          "KNOUX_VISUAL_EVIDENCE=$evidenceDirectory" >> $env:GITHUB_ENV

      - name: Verify package, media tools, Open With, single instance, smoke, and cleanup
        shell: pwsh
        run: |
          $exe = Get-Item -LiteralPath 'out\KNOUX Player X-win32-x64\knoux-player-x.exe'
          if (-not $exe -or $exe.Length -le 0) { throw 'Packaged executable is missing or empty.' }
          $squirrelInstaller = Get-Item -LiteralPath $env:KNOUX_SQUIRREL_SETUP
          $visualInstaller = Get-Item -LiteralPath $env:KNOUX_VISUAL_INSTALLER
          if (-not $squirrelInstaller -or $squirrelInstaller.Length -le 0) { throw 'Squirrel installer is missing or empty.' }
          if (-not $visualInstaller -or $visualInstaller.Length -le 0) { throw 'Visual installer is missing or empty.' }
          $resources = Join-Path $exe.Directory.FullName 'resources'
          $ffmpeg = Get-ChildItem $resources -Recurse -Filter 'ffmpeg.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          $ffprobe = Get-ChildItem $resources -Recurse -Filter 'ffprobe.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $ffmpeg -or $ffmpeg.Length -le 0) { throw 'Packaged ffmpeg.exe is missing or empty.' }
          if (-not $ffprobe -or $ffprobe.Length -le 0) { throw 'Packaged ffprobe.exe is missing or empty.' }

          $ffmpegVersion = @(& $ffmpeg.FullName -version 2>&1)
          $ffmpegExit = $LASTEXITCODE
          Write-Host ($ffmpegVersion | Select-Object -First 1)
          if ($ffmpegExit -ne 0) { throw "Packaged ffmpeg.exe did not execute: $ffmpegExit" }
          $ffprobeVersion = @(& $ffprobe.FullName -version 2>&1)
          $ffprobeExit = $LASTEXITCODE
          Write-Host ($ffprobeVersion | Select-Object -First 1)
          if ($ffprobeExit -ne 0) { throw "Packaged ffprobe.exe did not execute: $ffprobeExit" }

          $settingsEvidence = Join-Path $env:KNOUX_VISUAL_EVIDENCE 'packaged-settings-persistence.json'
          $settingsTest = Start-Process -FilePath $exe.FullName -ArgumentList @('--settings-self-test', "--settings-evidence=$settingsEvidence") -Wait -PassThru
          if ($settingsTest.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $settingsEvidence)) {
            throw "Packaged settings persistence self-test failed with exit code $($settingsTest.ExitCode)."
          }
          $settingsDocument = Get-Content -LiteralPath $settingsEvidence -Raw | ConvertFrom-Json
          $requiredSettingsChecks = @('atomic-save', 'restart-restore', 'reset-defaults', 'import-export-round-trip', 'corrupt-settings-backup-recovery', 'no-temporary-files')
          if ($settingsDocument.product -ne 'KNOUX Player X' -or $settingsDocument.success -ne $true -or
              $settingsDocument.mode -ne 'settings-persistence' -or $settingsDocument.packaged -ne $true -or
              $settingsDocument.schemaVersion -ne 3 -or $settingsDocument.corruptBackups -ne 1) {
            Get-Content -LiteralPath $settingsEvidence | Write-Host
            throw 'Packaged settings evidence metadata is invalid.'
          }
          foreach ($check in $requiredSettingsChecks) {
            if ($check -notin @($settingsDocument.checks)) { throw "Packaged settings evidence is missing check: $check" }
          }

          $fixture = Join-Path $env:RUNNER_TEMP 'knoux-open-with-smoke.mp4'
          & $ffmpeg.FullName -hide_banner -loglevel error -y -f lavfi -i 'testsrc2=size=320x180:rate=15:duration=2' -c:v mpeg4 -q:v 5 $fixture
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $fixture) -or (Get-Item $fixture).Length -le 1000) {
            throw 'Synthetic Open With fixture could not be generated.'
          }

          Get-Process -Name 'knoux-player-x' -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $primaryOut = Join-Path $env:RUNNER_TEMP 'knoux-primary-out.log'
          $primaryErr = Join-Path $env:RUNNER_TEMP 'knoux-primary-err.log'
          $secondaryOut = Join-Path $env:RUNNER_TEMP 'knoux-secondary-out.log'
          $secondaryErr = Join-Path $env:RUNNER_TEMP 'knoux-secondary-err.log'
          $startupTrace = Join-Path $env:RUNNER_TEMP 'knoux-startup-trace.log'
          $electronLog = Join-Path $env:RUNNER_TEMP 'knoux-electron.log'
          $env:KNOUX_STARTUP_TRACE_FILE = $startupTrace
          $env:ELECTRON_ENABLE_LOGGING = '1'
          $env:ELECTRON_LOG_FILE = $electronLog

          function Write-KnouxStartupDiagnostics {
            Get-CimInstance Win32_Process |
              Where-Object { $_.Name -match '^(knoux-player-x|electron|ffmpeg|ffprobe)\.exe$' } |
              Select-Object ProcessId, ParentProcessId, Name, CommandLine |
              Format-List
            Get-Process -Name 'knoux-player-x' -ErrorAction SilentlyContinue |
              Select-Object Id, Responding, MainWindowHandle, MainWindowTitle, Path |
              Format-List
            $asar = Join-Path $resources 'app.asar'
            Write-Host "--- app.asar ($asar) ---"
            if (Test-Path $asar) {
              Get-Item $asar | Select-Object FullName, Length, LastWriteTime | Format-List
              npx --yes @electron/asar list $asar | Select-String '\.vite/build/(main-entry|main-|media-tool-env|preload-entry)'
            } else {
              Write-Host 'app.asar is missing.'
            }
            Write-Host '--- primary stderr ---'
            if (Test-Path $primaryErr) { Get-Content $primaryErr }
            Write-Host '--- secondary stderr ---'
            if (Test-Path $secondaryErr) { Get-Content $secondaryErr }
            Write-Host '--- startup trace ---'
            if (Test-Path $startupTrace) { Get-Content $startupTrace }
            Write-Host '--- electron log ---'
            if (Test-Path $electronLog) { Get-Content $electronLog }
          }

          $process = Start-Process -FilePath $exe.FullName -ArgumentList @($fixture) -RedirectStandardOutput $primaryOut -RedirectStandardError $primaryErr -PassThru
          Start-Sleep -Seconds 20
          if ($process.HasExited) {
            Write-KnouxStartupDiagnostics
            throw "Packaged application exited early: $($process.ExitCode)"
          }

          $primaryIds = @(Get-Process -Name 'knoux-player-x' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Id)
          if ($primaryIds.Count -lt 1) { throw 'Primary KNOUX process set was not detected.' }

          $second = Start-Process -FilePath $exe.FullName -ArgumentList @($fixture) -RedirectStandardOutput $secondaryOut -RedirectStandardError $secondaryErr -PassThru
          if (-not $second.WaitForExit(15000)) {
            Write-Host "Primary PID: $($process.Id); secondary PID: $($second.Id)"
            Write-KnouxStartupDiagnostics
            Get-Process -Name 'knoux-player-x' -ErrorAction SilentlyContinue | Stop-Process -Force
            throw 'Second launcher process did not exit after forwarding the media request.'
          }
          Start-Sleep -Seconds 3
          $remainingPrimaryIds = @(Get-Process -Name 'knoux-player-x' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Id)
          if (@($remainingPrimaryIds | Where-Object { $_ -in $primaryIds }).Count -lt 1) {
            throw 'Primary application exited while handling a second-instance media request.'
          }

          $process.CloseMainWindow() | Out-Null
          Start-Sleep -Seconds 5
          Get-Process -Name 'knoux-player-x' -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3
          $orphans = @(Get-Process | Where-Object { $_.ProcessName -match '^(knoux-player-x|electron|ffmpeg|ffprobe)$' })
          if ($orphans.Count -gt 0) {
            $orphans | Stop-Process -Force
            throw 'KNOUX, Electron, or media-tool processes remained after shutdown.'
          }

          Get-FileHash $exe.FullName -Algorithm SHA256 | Format-List | Out-File artifact-hashes.txt
          Get-FileHash $squirrelInstaller.FullName -Algorithm SHA256 | Format-List | Out-File artifact-hashes.txt -Append
          Get-FileHash $visualInstaller.FullName -Algorithm SHA256 | Format-List | Out-File artifact-hashes.txt -Append
          Get-FileHash $ffmpeg.FullName -Algorithm SHA256 | Format-List | Out-File artifact-hashes.txt -Append
          Get-FileHash $ffprobe.FullName -Algorithm SHA256 | Format-List | Out-File artifact-hashes.txt -Append
          foreach ($log in @($primaryOut, $primaryErr, $secondaryOut, $secondaryErr, $startupTrace, $electronLog)) {
            if (Test-Path -LiteralPath $log) {
              Copy-Item -LiteralPath $log -Destination (Join-Path $env:KNOUX_VISUAL_EVIDENCE (Split-Path -Leaf $log)) -Force
            }
          }
          Write-Host '--- SHA256 release evidence ---'
          Get-Content artifact-hashes.txt | Write-Host

      - name: Verify visual installer install, repair, and uninstall
        shell: pwsh
        run: |
          $visualInstaller = Get-Item -LiteralPath $env:KNOUX_VISUAL_INSTALLER
          $evidenceDirectory = $env:KNOUX_VISUAL_EVIDENCE
          New-Item -ItemType Directory -Path $evidenceDirectory -Force | Out-Null

          function Invoke-VisualAcceptance {
            param([string]$Mode, [string]$Argument, [string]$EvidenceName)
            $evidence = Join-Path $evidenceDirectory $EvidenceName
            Remove-Item -LiteralPath $evidence -Force -ErrorAction SilentlyContinue
            $acceptanceProcess = Start-Process -FilePath $visualInstaller.FullName -ArgumentList @($Argument, "--evidence=$evidence") -Wait -PassThru -WindowStyle Hidden
            $exitCode = $acceptanceProcess.ExitCode
            if ($exitCode -ne 0) { throw "Visual installer $Mode test failed with exit code $exitCode." }
            if (-not (Test-Path $evidence) -or (Get-Item $evidence).Length -le 0) {
              throw "Visual installer $Mode evidence is missing."
            }
            $document = Get-Content -LiteralPath $evidence -Raw | ConvertFrom-Json
            if ($document.success -ne $true -or $document.mode -ne $Mode) {
              Get-Content -LiteralPath $evidence | Write-Host
              throw "Visual installer $Mode evidence did not report success."
            }
            $details = @($document.details)
            if ($Mode -in @('install', 'repair')) {
              if ('runtime-verified=True' -notin $details -or 'expected-prior-state=True' -notin $details) {
                throw "Visual installer $Mode evidence did not verify the installed runtime."
              }
            } elseif ('removed=True' -notin $details -or 'shortcut-removed=True' -notin $details -or 'uninstall-finalized=True' -notin $details) {
              throw 'Visual installer uninstall evidence did not verify complete removal.'
            }
            Get-Content -LiteralPath $evidence | Write-Host
          }

          Invoke-VisualAcceptance -Mode 'install' -Argument '--install-silent-test' -EvidenceName 'install.json'
          Invoke-VisualAcceptance -Mode 'repair' -Argument '--repair-silent-test' -EvidenceName 'repair.json'
          $repairDocument = Get-Content -LiteralPath (Join-Path $evidenceDirectory 'repair.json') -Raw | ConvertFrom-Json
          $installedDetail = @($repairDocument.details | Where-Object { $_ -like 'installed-executable=*' } | Select-Object -First 1)
          $installedExecutable = if ($installedDetail.Count -eq 1) { $installedDetail[0].Substring('installed-executable='.Length) } else { '' }
          if (-not (Test-Path -LiteralPath $installedExecutable -PathType Leaf)) { throw 'Repair evidence did not identify an installed executable.' }
          $installedSettingsEvidence = Join-Path $evidenceDirectory 'installed-settings-persistence.json'
          $installedSettingsTest = Start-Process -FilePath $installedExecutable -ArgumentList @('--settings-self-test', "--settings-evidence=$installedSettingsEvidence") -Wait -PassThru -WindowStyle Hidden
          if ($installedSettingsTest.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $installedSettingsEvidence)) {
            throw "Installed settings persistence self-test failed with exit code $($installedSettingsTest.ExitCode)."
          }
          $installedSettingsDocument = Get-Content -LiteralPath $installedSettingsEvidence -Raw | ConvertFrom-Json
          if ($installedSettingsDocument.success -ne $true -or $installedSettingsDocument.packaged -ne $true -or
              $installedSettingsDocument.mode -ne 'settings-persistence') {
            throw 'Installed settings persistence evidence is invalid.'
          }
          Get-Process -Name 'knoux-player-x' -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          Invoke-VisualAcceptance -Mode 'uninstall' -Argument '--uninstall-silent-test' -EvidenceName 'uninstall.json'

          $updateProcesses = @(Get-Process -Name 'Update' -ErrorAction SilentlyContinue)
          if ($updateProcesses.Count -gt 0) {
            $updateProcesses | Stop-Process -Force
            throw 'Squirrel Update.exe remained after visual installer acceptance.'
          }

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: knoux-windows-installer-${{ github.sha }}
          if-no-files-found: error
          path: |
            out/make/**/*.exe
            artifact-hashes.txt

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: knoux-windows-evidence-${{ github.sha }}
          if-no-files-found: error
          path: |
            artifact-hashes.txt
            package-lock.json
            assets/icons/**
            assets/branding/asset-manifest.json
            out/visual-installer-evidence/*.json
            out/visual-installer-evidence/*.log
