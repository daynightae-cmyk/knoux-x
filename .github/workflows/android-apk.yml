name: Android APK (Capacitor)

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'assets/**'
      - 'tests/**'
      - 'tools/android-emulator-smoke.sh'
      - 'tools/prepare-android-branding.cjs'
      - 'tools/prepare-android-premium-splash.cjs'
      - 'tools/prepare-android-native-media.cjs'
      - 'tools/prepare-android-functional-closure.cjs'
      - 'tools/verify-android-apk.cjs'
      - 'tools/verify-android-screen.cjs'
      - 'electron/**'
      - 'index.html'
      - 'vite.renderer.config.ts'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'assets/**'
      - 'tests/**'
      - 'tools/android-emulator-smoke.sh'
      - 'tools/prepare-android-branding.cjs'
      - 'tools/prepare-android-premium-splash.cjs'
      - 'tools/prepare-android-native-media.cjs'
      - 'tools/prepare-android-functional-closure.cjs'
      - 'tools/verify-android-apk.cjs'
      - 'tools/verify-android-screen.cjs'
      - 'electron/**'
      - 'index.html'
      - 'vite.renderer.config.ts'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: knoux-x-android-${{ github.ref }}
  cancel-in-progress: true

env:
  CAPACITOR_VERSION: '8.5.0'

jobs:
  build-debug-apk:
    name: Validate, launch-test, and build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Ensure Android API 36 SDK is available
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install locked KNOUX dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Restore test/runtime binaries
        run: npm rebuild electron ffmpeg-static @derhuerst/ffprobe-static sharp --foreground-scripts

      - name: Verify official KNOUX brand sources
        run: npm run brand:verify

      - name: TypeScript gate
        run: npm run typecheck

      - name: ESLint gate
        run: npm run lint -- --max-warnings=0

      - name: Unit test gate
        run: npm test -- --runInBand

      - name: Install pinned Capacitor build tooling without mutating lockfile
        run: >-
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund
          @capacitor/core@${CAPACITOR_VERSION}
          @capacitor/cli@${CAPACITOR_VERSION}
          @capacitor/android@${CAPACITOR_VERSION}

      - name: Build KNOUX Android renderer
        run: npx vite build --config vite.renderer.config.ts --outDir dist

      - name: Generate and synchronize Android project
        shell: bash
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Install KNOUX native media foundations
        shell: bash
        run: |
          node tools/prepare-android-native-media.cjs
          node tools/prepare-android-functional-closure.cjs
          grep -F 'android:supportsPictureInPicture="true"' android/app/src/main/AndroidManifest.xml
          grep -F 'android:foregroundServiceType="mediaPlayback"' android/app/src/main/AndroidManifest.xml
          grep -F 'android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK' android/app/src/main/AndroidManifest.xml
          grep -F '@CapacitorPlugin(name = "KnouxMediaSession")' android/app/src/main/java/dev/knoux/playerx/KnouxMediaSessionPlugin.java
          grep -F 'class KnouxPlaybackService extends Service' android/app/src/main/java/dev/knoux/playerx/KnouxPlaybackService.java
          grep -F 'registerPlugin(KnouxMediaSessionPlugin.class)' android/app/src/main/java/dev/knoux/playerx/MainActivity.java
          grep -F '@CapacitorPlugin(name = "KnouxSaf")' android/app/src/main/java/dev/knoux/playerx/KnouxSafPlugin.java
          grep -F 'Intent.ACTION_OPEN_DOCUMENT' android/app/src/main/java/dev/knoux/playerx/KnouxSafPlugin.java
          grep -F 'takePersistableUriPermission' android/app/src/main/java/dev/knoux/playerx/KnouxSafPlugin.java
          grep -F 'registerPlugin(KnouxSafPlugin.class)' android/app/src/main/java/dev/knoux/playerx/MainActivity.java
          grep -F '@CapacitorPlugin(name = "KnouxScreenCapture")' android/app/src/main/java/dev/knoux/playerx/KnouxScreenCapturePlugin.java
          grep -F 'MediaProjectionManager' android/app/src/main/java/dev/knoux/playerx/KnouxScreenCapturePlugin.java
          grep -F 'MediaRecorder.VideoEncoder.H264' android/app/src/main/java/dev/knoux/playerx/KnouxScreenCaptureService.java
          grep -F 'android:foregroundServiceType="mediaProjection"' android/app/src/main/AndroidManifest.xml
          grep -F 'android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION' android/app/src/main/AndroidManifest.xml
          grep -F 'registerPlugin(KnouxScreenCapturePlugin.class)' android/app/src/main/java/dev/knoux/playerx/MainActivity.java

      - name: Configure Android media permissions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          marker = '    <application'
          permissions = '''    <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
          '''
          if 'android.permission.CAMERA' not in text:
              if marker not in text:
                  raise SystemExit('AndroidManifest application marker not found')
              text = text.replace(marker, permissions + marker, 1)
          manifest.write_text(text, encoding='utf-8')
          PY
          grep -q 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.RECORD_AUDIO' android/app/src/main/AndroidManifest.xml

      - name: Apply and verify KNOUX Android branding
        shell: bash
        run: |
          node tools/prepare-android-branding.cjs
          node tools/prepare-android-premium-splash.cjs
          grep -F '<string name="app_name">KNOUX X</string>' android/app/src/main/res/values/strings.xml
          grep -F 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml
          grep -F 'android:roundIcon="@mipmap/ic_launcher_round"' android/app/src/main/AndroidManifest.xml
          grep -F '<monochrome android:drawable="@mipmap/ic_launcher_monochrome" />' android/app/src/main/res/mipmap-anydpi-v33/ic_launcher.xml
          grep -F '<item name="windowSplashScreenBackground">@color/knoux_splash_background</item>' android/app/src/main/res/values/styles.xml
          grep -F '<item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>' android/app/src/main/res/values/styles.xml
          grep -F '<color name="colorAccent">#8B39FF</color>' android/app/src/main/res/values/colors.xml
          test -s android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android/app/src/main/res/drawable/splash.png

      - name: Build APK
        working-directory: android
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage APK and checksum
        shell: bash
        run: |
          rm -rf android-ci-output
          mkdir -p android-ci-output
          cp android/app/build/outputs/apk/debug/app-debug.apk android-ci-output/KNOUX-X-Android-debug.apk
          cp android/knoux-branding-report.json android-ci-output/android-branding-report.json
          cp android/app/src/main/AndroidManifest.xml android-ci-output/android-manifest.xml
          cp android/app/src/main/res/values/strings.xml android-ci-output/android-strings.xml
          cp android/app/src/main/res/drawable/splash.png android-ci-output/android-premium-splash.png
          cp android/app/src/main/java/dev/knoux/playerx/KnouxMediaSessionPlugin.java android-ci-output/KnouxMediaSessionPlugin.java
          cp android/app/src/main/java/dev/knoux/playerx/KnouxPlaybackService.java android-ci-output/KnouxPlaybackService.java
          cp android/app/src/main/java/dev/knoux/playerx/KnouxSafPlugin.java android-ci-output/KnouxSafPlugin.java
          cp android/app/src/main/java/dev/knoux/playerx/KnouxScreenCapturePlugin.java android-ci-output/KnouxScreenCapturePlugin.java
          cp android/app/src/main/java/dev/knoux/playerx/KnouxScreenCaptureService.java android-ci-output/KnouxScreenCaptureService.java
          sha256sum android-ci-output/KNOUX-X-Android-debug.apk > android-ci-output/KNOUX-X-Android-debug.apk.sha256
          stat -c '%s' android-ci-output/KNOUX-X-Android-debug.apk > android-ci-output/KNOUX-X-Android-debug.apk.size
          test -s android-ci-output/KNOUX-X-Android-debug.apk

      - name: Verify packaged APK identity and launcher branding
        run: node tools/verify-android-apk.cjs

      - name: Enable KVM permissions for Android emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          force-avd-creation: true
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-snapshot-save -camera-back none -camera-front none
          script: bash tools/android-emulator-smoke.sh

      - name: Upload installable APK and launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KNOUX-X-Android-debug-${{ github.sha }}
          path: android-ci-output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
