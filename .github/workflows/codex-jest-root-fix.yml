name: Codex Phase A mobile contract repair

on:
  push:
    branches:
      - codex/absolute-final-product-closure-20260908

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout execution branch
        uses: actions/checkout@v4
        with:
          ref: codex/absolute-final-product-closure-20260908
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Restore test/runtime binaries
        run: npm rebuild electron ffmpeg-static @derhuerst/ffprobe-static sharp --foreground-scripts

      - name: Repair remaining mobile shell source contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str, *, already: str | None = None) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if already and already in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one repair anchor, found {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/store/appStore.ts',
              "      currentView: 'home',",
              "      currentView: 'player',",
              already="      currentView: 'player',",
          )

          library = Path('src/features/library/MobileMediaLibraryView.tsx')
          text = library.read_text(encoding='utf-8')

          refresh = "<button type=\"button\" className=\"kml-round\" aria-label={ar ? 'تحديث' : 'Refresh'} disabled={busy || !libraryPath} onClick={() => void loadLibrary()}><RefreshCw size={18} /></button>"
          folder = "<button type=\"button\" className=\"kml-round\" aria-label={ar ? 'اختيار مجلد الوسائط' : 'Choose media folder'} title={ar ? 'اختيار مجلد الوسائط' : 'Choose media folder'} disabled={busy} onClick={() => void chooseLibraryRoot()}><FolderOpen size={18} /></button>"
          if folder not in text:
              if text.count(refresh) != 1:
                  raise SystemExit('MobileMediaLibraryView: refresh anchor changed')
              text = text.replace(refresh, refresh + '\n          ' + folder, 1)

          if 'Import from device' not in text or 'Choose ordinary media files — never project JSON.' not in text:
              pattern = re.compile(
                  r'(?P<indent>^[ \t]*)<button type="button" className="kml-import-hero" onClick=\{\(\) => libraryPath \? void importForTab\(\) : void chooseLibraryRoot\(\)\} disabled=\{busy \|\| tab === \'recents\'\}>\s*'
                  r'<FolderOpen size=\{36\} />\s*'
                  r'<div><strong>.*?</strong><span>.*?</span></div>\s*'
                  r'<span>›</span>\s*</button>',
                  re.MULTILINE | re.DOTALL,
              )
              match = pattern.search(text)
              if match is None:
                  raise SystemExit('MobileMediaLibraryView: structural import hero anchor changed')
              indent = match.group('indent')
              replacement = '\n'.join([
                  f'{indent}<button type="button" className="kml-import-hero" onClick={{() => void importForTab()}} disabled={{busy || tab === \'recents\'}}>',
                  f'{indent}  <FolderOpen size={{36}} />',
                  f"{indent}  <div><strong>{{busy ? (ar ? 'جارٍ فتح الجهاز…' : 'Opening device…') : (ar ? 'استيراد من الجهاز' : 'Import from device')}}</strong><span>{{ar ? 'اختر ملفات وسائط عادية — وليس ملفات مشروع JSON.' : 'Choose ordinary media files — never project JSON.'}}</span></div>",
                  f'{indent}  <span>›</span>',
                  f'{indent}</button>',
              ])
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'MobileMediaLibraryView: expected one import hero, replaced {count}')
          library.write_text(text, encoding='utf-8')

          replace_once(
              'src/features/image-studio/MobileBeautyRetouchView.tsx',
              "          <ImagePlus size={17} /> {opening ? 'Opening' : source ? 'Change' : 'Photo'}",
              "          <ImagePlus size={17} /> {opening ? 'Opening' : source ? 'Change Photo' : 'Open Photo'}",
              already="source ? 'Change Photo' : 'Open Photo'",
          )

          replace_once(
              'src/platform/AndroidBeautyExtension.tsx',
              "            {arabic ? 'كل الوجوه' : 'All faces'}",
              "            {arabic ? 'تطبيق على كل الوجوه' : 'Apply all faces'}",
              already="{arabic ? 'تطبيق على كل الوجوه' : 'Apply all faces'}",
          )
          PY

      - name: Persist source repair before validation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/store/appStore.ts \
            src/features/library/MobileMediaLibraryView.tsx \
            src/features/image-studio/MobileBeautyRetouchView.tsx \
            src/platform/AndroidBeautyExtension.tsx
          if ! git diff --cached --quiet; then
            git commit -m "fix(mobile): restore premium shell source contracts"
            git push origin HEAD:codex/absolute-final-product-closure-20260908
          fi

      - name: TypeScript gate
        run: npm run typecheck

      - name: ESLint gate
        run: npm run lint -- --max-warnings=0

      - name: Jest gate with diagnostic capture
        id: jest
        shell: bash
        run: |
          set +e
          npm test -- --runInBand 2>&1 | tee /tmp/jest.log
          status=${PIPESTATUS[0]}
          cp /tmp/jest.log jest-full.log
          python - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/jest.log').read_text(encoding='utf-8', errors='replace').splitlines()
          needles = ('FAIL ', 'Expected:', 'Received:', 'Test Suites:', 'Tests:', 'Snapshots:', 'Time:', 'Ran all test suites', '● ')
          selected = []
          for index, line in enumerate(lines):
              if any(needle in line for needle in needles):
                  selected.extend(lines[max(0, index - 6):min(len(lines), index + 16)])
          if not selected:
              selected = lines[-240:]
          compact = []
          previous = None
          for line in selected:
              if line != previous:
                  compact.append(line)
              previous = line
          Path('jest-diagnostic.txt').write_text('\n'.join(compact[-1000:]) + '\n', encoding='utf-8')
          PY
          exit "$status"

      - name: Upload Jest diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-phase-a-jest-diagnostic
          path: |
            jest-diagnostic.txt
            jest-full.log
          if-no-files-found: warn
          retention-days: 1
