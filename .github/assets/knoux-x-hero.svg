    <circle cx="1090" cy="215" r="340" fill="url(#halo)"/>
    <circle cx="250" cy="450" r="230" fill="#6B36B1" opacity=".12" filter="url(#blur)"/>
    <path d="M0 416 C280 315 390 506 703 426 S1160 318 1440 405" fill="none" stroke="url(#rail)" stroke-width="2" stroke-opacity=".20"/>
