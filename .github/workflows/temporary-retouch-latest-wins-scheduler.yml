name: Temporary Retouch Latest-Wins Scheduler Hardening

on:
  push:
    branches:
      - codex/retouch-latest-wins-render-scheduler-20260908

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply latest-wins render scheduling
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const schedulerPath = 'src/features/image-studio/retouch/latestRenderScheduler.ts';
          if (fs.existsSync(schedulerPath)) throw new Error(`${schedulerPath} already exists`);
          fs.writeFileSync(schedulerPath, `export type LatestRenderTask = (revision: number, isCurrent: () => boolean) => Promise<void> | void;\n\n/**\n * Serializes expensive canvas renders while keeping only the newest pending task.\n * A new request invalidates the in-flight revision immediately, allowing the\n * active render to stop at its next revision guard instead of painting stale\n * pixels. Pending intermediate requests are replaced before they start.\n */\nexport class LatestRenderScheduler {\n  private revision = 0;\n  private running = false;\n  private pending: { revision: number; task: LatestRenderTask } | null = null;\n  private disposed = false;\n  private readonly idleWaiters: Array<() => void> = [];\n\n  request(task: LatestRenderTask): number {\n    if (this.disposed) return this.revision;\n    const revision = ++this.revision;\n    this.pending = { revision, task };\n    void this.drain();\n    return revision;\n  }\n\n  isCurrent(revision: number): boolean {\n    return !this.disposed && revision === this.revision;\n  }\n\n  waitUntilIdle(): Promise<void> {\n    if (!this.running && !this.pending) return Promise.resolve();\n    return new Promise((resolve) => this.idleWaiters.push(resolve));\n  }\n\n  dispose(): void {\n    if (this.disposed) return;\n    this.disposed = true;\n    this.revision += 1;\n    this.pending = null;\n    this.releaseIdleWaiters();\n  }\n\n  private async drain(): Promise<void> {\n    if (this.running || this.disposed) return;\n    this.running = true;\n    try {\n      while (!this.disposed && this.pending) {\n        const next = this.pending;\n        this.pending = null;\n        await next.task(next.revision, () => this.isCurrent(next.revision));\n      }\n    } finally {\n      this.running = false;\n      if (!this.disposed && this.pending) {\n        void this.drain();\n        return;\n      }\n      this.releaseIdleWaiters();\n    }\n  }\n\n  private releaseIdleWaiters(): void {\n    const waiters = this.idleWaiters.splice(0, this.idleWaiters.length);\n    for (const resolve of waiters) resolve();\n  }\n}\n`, 'utf8');

          const canvasPath = 'src/features/image-studio/components/ImageStudioCanvas.tsx';
          let canvas = fs.readFileSync(canvasPath, 'utf8');
          const importNeedle = "import { createRetouchPerformanceRecorder, markRetouchInteraction, markRetouchRenderRequested } from '../retouch/retouchPerformanceTelemetry';\n";
          if ((canvas.split(importNeedle).length - 1) !== 1) throw new Error('Telemetry import marker mismatch');
          canvas = canvas.replace(importNeedle, importNeedle + "import { LatestRenderScheduler } from '../retouch/latestRenderScheduler';\n");

          const refNeedle = '  const renderVersionRef = useRef(0);';
          if ((canvas.split(refNeedle).length - 1) !== 1) throw new Error('renderVersionRef marker mismatch');
          canvas = canvas.replace(refNeedle, `  const renderSchedulerRef = useRef<LatestRenderScheduler | null>(null);\n  if (renderSchedulerRef.current === null) renderSchedulerRef.current = new LatestRenderScheduler();`);

          const headerNeedle = `  const renderFrame = useCallback(async () => {\n    const canvas = canvasRef.current;\n    if (!canvas || !currentDocument) return;\n    markRetouchRenderRequested();\n    const myVersion = ++renderVersionRef.current;`;
          if ((canvas.split(headerNeedle).length - 1) !== 1) throw new Error('renderFrame header marker mismatch');
          canvas = canvas.replace(headerNeedle, `  const renderFrame = useCallback(async (myVersion: number, isCurrent: () => boolean) => {\n    const canvas = canvasRef.current;\n    if (!canvas || !currentDocument) return;`);

          const guardNeedle = 'myVersion !== renderVersionRef.current';
          const guardCount = canvas.split(guardNeedle).length - 1;
          if (guardCount !== 4) throw new Error(`Expected 4 render revision guards; found ${guardCount}`);
          canvas = canvas.split(guardNeedle).join('!isCurrent()');

          const effectNeedle = `  useEffect(() => {\n    void renderFrame();\n  }, [renderFrame, documentVersion]);`;
          if ((canvas.split(effectNeedle).length - 1) !== 1) throw new Error('render useEffect marker mismatch');
          canvas = canvas.replace(effectNeedle, `  useEffect(() => {\n    if (!currentDocument) return;\n    markRetouchRenderRequested();\n    renderSchedulerRef.current?.request((revision, isCurrent) => renderFrame(revision, isCurrent));\n  }, [currentDocument, documentVersion, renderFrame]);\n\n  useEffect(() => () => {\n    renderSchedulerRef.current?.dispose();\n    renderSchedulerRef.current = null;\n  }, []);`);
          fs.writeFileSync(canvasPath, canvas, 'utf8');

          const testPath = 'tests/unit/latest-render-scheduler.test.ts';
          if (fs.existsSync(testPath)) throw new Error(`${testPath} already exists`);
          fs.writeFileSync(testPath, `import { LatestRenderScheduler } from '../../src/features/image-studio/retouch/latestRenderScheduler';\n\ndescribe('LatestRenderScheduler', () => {\n  it('keeps one in-flight task and replaces intermediate pending renders with the latest request', async () => {\n    const scheduler = new LatestRenderScheduler();\n    const started: number[] = [];\n    const currentAfterFirst: boolean[] = [];\n    let releaseFirst!: () => void;\n    const firstGate = new Promise<void>((resolve) => { releaseFirst = resolve; });\n\n    const first = scheduler.request(async (revision, isCurrent) => {\n      started.push(revision);\n      await firstGate;\n      currentAfterFirst.push(isCurrent());\n    });\n    const second = scheduler.request(async (revision) => { started.push(revision); });\n    const third = scheduler.request(async (revision, isCurrent) => {\n      started.push(revision);\n      expect(isCurrent()).toBe(true);\n    });\n\n    expect([first, second, third]).toEqual([1, 2, 3]);\n    releaseFirst();\n    await scheduler.waitUntilIdle();\n\n    expect(started).toEqual([1, 3]);\n    expect(currentAfterFirst).toEqual([false]);\n    scheduler.dispose();\n  });\n\n  it('invalidates the running revision immediately when a newer render is requested', async () => {\n    const scheduler = new LatestRenderScheduler();\n    let release!: () => void;\n    const gate = new Promise<void>((resolve) => { release = resolve; });\n    let firstStillCurrent = true;\n\n    scheduler.request(async (_revision, isCurrent) => {\n      await gate;\n      firstStillCurrent = isCurrent();\n    });\n    scheduler.request(async () => undefined);\n    release();\n    await scheduler.waitUntilIdle();\n\n    expect(firstStillCurrent).toBe(false);\n    scheduler.dispose();\n  });\n\n  it('drops pending work on dispose and invalidates the active revision', async () => {\n    const scheduler = new LatestRenderScheduler();\n    let release!: () => void;\n    const gate = new Promise<void>((resolve) => { release = resolve; });\n    const started: number[] = [];\n    let activeCurrent = true;\n\n    scheduler.request(async (revision, isCurrent) => {\n      started.push(revision);\n      await gate;\n      activeCurrent = isCurrent();\n    });\n    scheduler.request(async (revision) => { started.push(revision); });\n    scheduler.dispose();\n    release();\n    await scheduler.waitUntilIdle();\n\n    expect(started).toEqual([1]);\n    expect(activeCurrent).toBe(false);\n  });\n});\n`, 'utf8');
          NODE

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/image-studio/retouch/latestRenderScheduler.ts src/features/image-studio/components/ImageStudioCanvas.tsx tests/unit/latest-render-scheduler.test.ts
          git commit -m "perf(retouch): coalesce stale canvas renders latest-first"
          git push origin HEAD:${{ github.ref_name }}
