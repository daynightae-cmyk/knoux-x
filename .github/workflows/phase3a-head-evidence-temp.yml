name: Phase 3A HEAD Evidence TEMP

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase3a-head-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accept:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CI: 'true'
      TARGET_SHA: 9adf5dff568ff7fcae01674e63e0aa832333673e
    steps:
      - name: Checkout exact authoritative main SHA
        uses: actions/checkout@v4
        with:
          ref: 9adf5dff568ff7fcae01674e63e0aa832333673e
          fetch-depth: 0

      - name: Verify exact clean tracked tree
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:TARGET_SHA) { throw "Wrong checkout: $head" }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }
          $tracked = (git status --short --untracked-files=no | Out-String).Trim()
          if ($tracked) { throw "Tracked tree is not clean:`n$tracked" }
          Write-Host "TARGET_SHA=$head"

      - name: Use Node 20.20.2
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure MSVC 2022 native toolchain
        shell: pwsh
        run: |
          $python = (Get-Command python -ErrorAction Stop).Source
          "npm_config_python=$python" >> $env:GITHUB_ENV
          "npm_config_msvs_version=2022" >> $env:GITHUB_ENV
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'MSVC 2022 x64 build tools are missing.' }
          node -v
          npm -v

      - name: Install deterministic dependencies
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed.' }

      - name: Rebuild Electron native modules
        shell: pwsh
        run: |
          npm exec electron-rebuild -- -f --only better-sqlite3,sharp
          if ($LASTEXITCODE -ne 0) { throw 'Electron native-module rebuild failed.' }

      - name: Prepare deterministic portrait fixtures
        shell: pwsh
        run: |
          $dir = Join-Path $PWD '_temp\live-evidence'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $source = Join-Path $dir 'retouch-portrait-albert-einstein.jpg'
          Invoke-WebRequest -Uri 'https://upload.wikimedia.org/wikipedia/commons/d/d3/Albert_Einstein_Head.jpg' -OutFile $source -UseBasicParsing
          if (-not (Test-Path $source) -or (Get-Item $source).Length -lt 100000) { throw 'Portrait fixture download failed.' }
          $helper = Join-Path $dir 'make-phase3a-fixtures.cjs'
          @'
          const sharp = require('sharp');
          const path = require('path');
          const root = process.cwd();
          const dir = path.join(root, '_temp', 'live-evidence');
          const source = path.join(dir, 'retouch-portrait-albert-einstein.jpg');
          Promise.all([
            sharp(source).resize(400, 533, { fit: 'cover', position: 'centre' }).jpeg({ quality: 95 }).toFile(path.join(dir, 'retouch-portrait-fixture.jpg')),
            sharp(source).resize(1200, 1599, { fit: 'cover', position: 'centre' }).png().toFile(path.join(dir, 'retouch-portrait-proxy-fixture.png')),
          ]).catch((error) => { console.error(error); process.exit(1); });
          '@ | Set-Content -LiteralPath $helper -Encoding utf8
          node $helper
          if ($LASTEXITCODE -ne 0) { throw 'Fixture resize failed.' }
          Get-ChildItem $dir -File | Select-Object Name,Length | Format-Table

      - name: TypeScript and focused regression gates
        shell: pwsh
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'TypeScript failed.' }
          npm run lint -- --max-warnings=0
          if ($LASTEXITCODE -ne 0) { throw 'ESLint failed.' }
          npm test -- --runInBand tests/unit/retouch-phase3-integration.test.ts tests/unit/retouch-phase3-canvas-targeting.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'Focused Phase 3A tests failed.' }

      - name: Package real Electron application
        shell: pwsh
        run: |
          npm run package -- --arch=x64
          if ($LASTEXITCODE -ne 0) { throw 'Electron Forge package failed.' }

      - name: Re-verify tracked tree before runtime
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:TARGET_SHA) { throw "HEAD moved before runtime: $head" }
          $tracked = (git status --short --untracked-files=no | Out-String).Trim()
          if ($tracked) { throw "Tracked tree changed before runtime:`n$tracked" }

      - name: Run authoritative Phase 3A Electron smoke
        shell: pwsh
        run: |
          node tools/retouch-runtime-smoke.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Phase 3A Electron smoke failed.' }

      - name: Validate authoritative evidence contract
        if: always()
        shell: pwsh
        run: |
          $jsonPath = '_temp\live-evidence\retouch-phase3-runtime-smoke.json'
          if (-not (Test-Path $jsonPath)) { throw 'Evidence JSON was not produced.' }
          $e = Get-Content $jsonPath -Raw | ConvertFrom-Json
          Write-Host (Get-Content $jsonPath -Raw)
          if ($e.commit -ne $env:TARGET_SHA) { throw "Evidence commit mismatch: $($e.commit)" }
          if ($e.trackedTreeClean -ne $true) { throw 'trackedTreeClean is not true.' }
          if ($e.runtimeResult -ne 'PASS') { throw "runtimeResult is $($e.runtimeResult)" }
          $keys = @('D0Baseline','D1MakeupTint','D2MakeupGlow','D3GeometryWarp','D4ManualSmooth','D5ManualHealing','D6DodgeBurn')
          $hashes = @()
          foreach ($key in $keys) {
            $value = [string]$e.states.$key
            if ($value -notmatch '^[0-9a-f]{64}$') { throw "Invalid state hash for ${key}: $value" }
            $hashes += $value
          }
          if (($hashes | Select-Object -Unique).Count -ne $keys.Count) { throw 'D0-D6 hashes are not all distinct.' }
          if ($e.undoRedo.undoExact -ne $true -or $e.undoRedo.redoExact -ne $true) { throw 'Undo/Redo exactness failed.' }
          if ($e.beforeAfter.exact -ne $true) { throw 'Before/After exactness failed.' }
          if ($e.saveReopen.exact -ne $true) { throw 'Save/Reopen exactness failed.' }
          if ($e.export.fullResolution -ne $true) { throw 'Full-resolution export failed.' }
          if ($e.proxyFinal.verified -ne $true) { throw 'Proxy/final verification failed.' }
          if ($e.staleSupersession.verified -ne $true) { throw 'Stale supersession verification failed.' }
          if ($e.layerIsolation.verified -ne $true) { throw 'Layer isolation verification failed.' }
          if ([int]$e.faceAnalysis.faceCount -lt 1) { throw 'Face analysis detected no face.' }
          if ([int]$e.faceAnalysis.landmarkCount -lt 478) { throw "Unexpected face landmark count: $($e.faceAnalysis.landmarkCount)" }
          $tracked = (git status --short --untracked-files=no | Out-String).Trim()
          if ($tracked) { throw "Tracked tree changed after runtime:`n$tracked" }
          Write-Host 'PHASE3A_HEAD_EVIDENCE_CONTRACT=PASS'

      - name: Upload authoritative Phase 3A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3a-head-evidence-9adf5dff
          path: _temp/live-evidence/
          if-no-files-found: error
          retention-days: 7
