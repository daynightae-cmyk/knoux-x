name: Generate KNOUX lockfile

on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/**'

permissions:
  contents: write

concurrency:
  group: generate-knoux-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          registry-url: https://registry.npmjs.org

      - name: Generate and validate lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls --depth=0

      - name: Commit lockfile to current Codex branch
        shell: pwsh
        run: |
          if (-not (Test-Path package-lock.json)) { throw 'package-lock.json was not generated.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'build: add deterministic Node 20 dependency lockfile'
            git push origin "HEAD:$env:GITHUB_REF_NAME"
          }
