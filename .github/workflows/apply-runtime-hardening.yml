name: Apply KNOUX runtime hardening

on:
  push:
    branches:
      - codex/knoux-player-x-full-rebuild
    paths:
      - tools/finalize-creative-runtime.cjs
      - .github/workflows/apply-runtime-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-knoux-runtime-hardening
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/codex/knoux-player-x-full-rebuild'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/knoux-player-x-full-rebuild
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2

      - name: Apply deterministic source hardening
        run: node tools/finalize-creative-runtime.cjs

      - name: Commit hardened runtime
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw 'Runtime hardening produced no source changes.' }
          git commit -m 'refactor: remove legacy eager runtime and harden desktop integration'
          git push origin HEAD:codex/knoux-player-x-full-rebuild
