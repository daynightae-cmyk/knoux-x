name: Temporary Knoux X Name Contract Migration

on:
  push:
    branches:
      - codex/absolute-final-product-closure-20260908

permissions:
  contents: write

jobs:
  migrate-name-contract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout execution branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Unify active runtime product identity
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const OLD = 'KNOUX Player X';
          const NEXT = 'Knoux X';
          const roots = ['electron', 'src', 'scripts', 'tools', 'tests'];
          const rootFiles = [
            'index.html',
            'splash.html',
            'package.json',
            'forge.config.js',
            'vite.main.config.ts',
            'vite.preload.config.ts',
            'vite.renderer.config.ts',
          ];
          const allowed = new Set(['.ts', '.tsx', '.js', '.cjs', '.mjs', '.json', '.html', '.css', '.scss', '.ps1', '.sh']);
          const changed = [];

          function patchFile(file) {
            if (!fs.existsSync(file) || !fs.statSync(file).isFile()) return;
            const ext = path.extname(file).toLowerCase();
            if (!allowed.has(ext) && !rootFiles.includes(file)) return;
            const before = fs.readFileSync(file, 'utf8');
            if (!before.includes(OLD)) return;
            const after = before.split(OLD).join(NEXT);
            fs.writeFileSync(file, after, 'utf8');
            changed.push(file);
          }

          function walk(dir) {
            if (!fs.existsSync(dir)) return;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                if (['node_modules', 'backups', 'reports', 'docs', '.git'].includes(entry.name)) continue;
                walk(full);
              } else {
                patchFile(full);
              }
            }
          }

          for (const root of roots) walk(root);
          for (const file of rootFiles) patchFile(file);

          if (changed.length === 0) {
            console.log('No active runtime occurrences of the legacy product name remain.');
          } else {
            console.log(`Updated ${changed.length} active files:`);
            for (const file of changed) console.log(` - ${file}`);
          }
          NODE

          git diff --check

          if git diff --quiet; then
            echo "No migration commit required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add electron src scripts tools tests index.html splash.html package.json forge.config.js vite.main.config.ts vite.preload.config.ts vite.renderer.config.ts
          git commit -m "fix(brand): unify Knoux X runtime identity contract"
          git push origin HEAD:${{ github.ref_name }}
