name: Temporary Fal Video Catalog Patch

on:
  push:
    branches:
      - codex/fal-video-queue-result-contract-20260908

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply Fal catalog patch
        run: node tools/temporary-fal-video-catalog-patch.cjs
      - name: Commit source patch
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/video-studio/ai/video-catalog.ts tests/unit/video-studio-ai.test.ts
          git commit -m "fix(video): align Fal Kling v3 catalog truth"
          git push origin HEAD:${{ github.ref_name }}
