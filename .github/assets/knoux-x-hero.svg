<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="540" viewBox="0 0 1440 540" role="img" aria-labelledby="title desc">
  <title id="title">KNOUX X — Create. Play. Enhance.</title>
  <desc id="desc">A midnight-violet cinematic banner with a luminous glass orbit, creative timeline and dual desktop and Android product identity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08050E"/><stop offset=".53" stop-color="#121025"/><stop offset="1" stop-color="#070A13"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#A663FF" stop-opacity=".50"/><stop offset=".45" stop-color="#6D31D6" stop-opacity=".18"/><stop offset="1" stop-color="#8E4CFF" stop-opacity="0"/></radialGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F0D9FF"/><stop offset=".42" stop-color="#C18DFF"/><stop offset="1" stop-color="#6D55FF"/></linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E2BBFF" stop-opacity=".96"/><stop offset=".48" stop-color="#8D56F7" stop-opacity=".56"/><stop offset="1" stop-color="#18D7FF" stop-opacity=".44"/></linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#B67AFF"/><stop offset=".52" stop-color="#7C57F8"/><stop offset="1" stop-color="#39C2DE"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M 48 0 L 0 0 0 48" fill="none" stroke="#9273C8" stroke-opacity=".08" stroke-width="1"/></pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="37"/></filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <clipPath id="frame"><rect width="1440" height="540" rx="28"/></clipPath>
  </defs>
