name: Generate KNOUX lockfile

on:
  workflow_dispatch:
  push:
    branches:
      - codex/knoux-player-x-full-rebuild
    paths:
      - package.json
      - .github/workflows/generate-lockfile.yml

permissions:
  contents: write

concurrency:
  group: knoux-lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/codex/knoux-player-x-full-rebuild'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/knoux-player-x-full-rebuild
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          registry-url: https://registry.npmjs.org

      - name: Generate and validate lockfile
        shell: pwsh
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'package-lock.json generation failed.' }
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm ci validation failed.' }
          npm ls --depth=0
          if ($LASTEXITCODE -ne 0) { throw 'Dependency graph validation failed.' }

      - name: Commit lockfile to execution branch
        shell: pwsh
        run: |
          if (-not (Test-Path package-lock.json)) { throw 'package-lock.json was not generated.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'build: add deterministic Node 20 dependency lockfile'
            git push origin HEAD:codex/knoux-player-x-full-rebuild
          } else {
            Write-Host 'Committed package-lock.json is already current.'
          }
