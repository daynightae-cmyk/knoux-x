<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KNOUX Player X</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #050409;
        --surface: #0d0915;
        --text: #fbfaff;
        --muted: #a69dac;
        --border: rgba(190, 156, 245, 0.24);
        --accent: #9d5cff;
        --accent-strong: #6d28d9;
        --cyan: #55dff5;
      }

      :root[data-appearance='light'] {
        color-scheme: light;
        --bg: #f4f2f8;
        --surface: #ffffff;
        --text: #18131f;
        --muted: #665d71;
        --border: rgba(55, 35, 80, 0.18);
        --accent: #6d28d9;
        --accent-strong: #5520ad;
        --cyan: #087f99;
      }

      *, *::before, *::after { box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        display: grid;
        place-items: center;
        color: var(--text);
        background:
          radial-gradient(circle at 78% 4%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 38%),
          linear-gradient(145deg, var(--bg), color-mix(in srgb, var(--surface) 82%, var(--bg)));
        font-family: Inter, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
        -webkit-user-select: none;
      }

      body::before {
        position: fixed;
        inset: 0;
        content: '';
        pointer-events: none;
        background:
          linear-gradient(115deg, transparent 30%, color-mix(in srgb, var(--accent) 8%, transparent) 48%, transparent 66%);
        transform: translateX(-110%);
        animation: light-sweep 900ms cubic-bezier(.2, 0, 0, 1) 120ms both;
      }

      .shell {
        position: relative;
        width: calc(100% - 28px);
        height: calc(100% - 28px);
        display: grid;
        grid-template-columns: minmax(0, 0.82fr) minmax(300px, 1.18fr);
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: color-mix(in srgb, var(--surface) 94%, transparent);
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.44);
      }

      .brand {
        position: relative;
        display: grid;
        align-content: center;
        justify-items: center;
        padding: 34px;
        border-inline-end: 1px solid var(--border);
        background:
          radial-gradient(circle at 50% 42%, color-mix(in srgb, var(--accent) 15%, transparent), transparent 46%),
          color-mix(in srgb, var(--bg) 76%, transparent);
      }

      .brand::after {
        position: absolute;
        inset: 20px;
        border: 1px solid color-mix(in srgb, var(--accent) 11%, transparent);
        border-radius: 18px;
        content: '';
        pointer-events: none;
      }

      .logo {
        position: relative;
        z-index: 1;
        width: 168px;
        height: 168px;
        display: block;
        object-fit: contain;
        filter: drop-shadow(0 18px 28px rgba(0, 0, 0, 0.26));
      }

      .content {
        display: grid;
        align-content: center;
        gap: 20px;
        padding: 42px 48px;
      }

      .product-line {
        color: var(--accent);
        font-size: 0.68rem;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: 2.45rem;
        line-height: 1;
        letter-spacing: -0.045em;
      }

      .attribution {
        margin: -8px 0 6px;
        color: var(--muted);
        font-size: 0.82rem;
      }

      .stage-block { display: grid; gap: 10px; }

      .stage-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        color: var(--muted);
        font-size: 0.78rem;
      }

      #stage { color: var(--text); font-weight: 600; }
      #percent { font-variant-numeric: tabular-nums; direction: ltr; }

      .progress {
        height: 5px;
        overflow: hidden;
        border-radius: 999px;
        background: color-mix(in srgb, var(--text) 9%, transparent);
      }

      .progress > span {
        display: block;
        width: 6%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--accent-strong), var(--accent), var(--cyan));
        box-shadow: 0 0 16px color-mix(in srgb, var(--accent) 34%, transparent);
        transition: width 180ms cubic-bezier(.2, 0, 0, 1);
      }

      .meta {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 0.7rem;
      }

      .meta i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #43d6a0;
        box-shadow: 0 0 0 3px color-mix(in srgb, #43d6a0 13%, transparent);
      }

      .version {
        position: absolute;
        inset-inline-end: 20px;
        bottom: 17px;
        color: var(--muted);
        font: 0.66rem/1 "Cascadia Code", Consolas, monospace;
        direction: ltr;
      }

      @keyframes light-sweep { to { transform: translateX(110%); } }

      @media (prefers-reduced-motion: reduce) {
        body::before { animation: none; }
        .progress > span { transition: none; }
      }
    </style>
  </head>
  <body>
    <main class="shell" aria-labelledby="product-name">
      <section class="brand" aria-hidden="true">
        <img id="logo" class="logo" alt="" />
      </section>
      <section class="content">
        <span class="product-line">A Knoux Product</span>
        <h1 id="product-name">KNOUX Player X</h1>
        <p class="attribution">Crafted by Eng. Sadek Elgazar (Knoux)</p>
        <div class="stage-block" role="status" aria-live="polite">
          <div class="stage-row"><span id="stage">Starting KNOUX</span><span id="percent">6%</span></div>
          <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="6"><span id="progress-bar"></span></div>
        </div>
        <div class="meta"><i></i><span id="privacy">Local-first desktop runtime</span></div>
      </section>
      <span class="version" id="version">v2.0.0</span>
    </main>
    <script>
      (() => {
        const query = new URLSearchParams(window.location.search);
        const locale = (query.get('locale') || 'en').toLowerCase();
        const isArabic = locale.startsWith('ar');
        document.documentElement.lang = isArabic ? 'ar' : 'en';
        document.documentElement.dir = isArabic ? 'rtl' : 'ltr';
        document.documentElement.dataset.appearance = query.get('appearance') === 'light' ? 'light' : 'dark';
        document.getElementById('logo').src = query.get('logo') || '';
        document.getElementById('version').textContent = `v${query.get('version') || '2.0.0'}`;
        document.getElementById('stage').textContent = isArabic ? 'بدء KNOUX' : 'Starting KNOUX';
        document.getElementById('privacy').textContent = isArabic ? 'بيئة سطح مكتب محلية أولًا' : 'Local-first desktop runtime';

        window.setKnouxStage = ({ label, progress }) => {
          const safeProgress = Math.max(0, Math.min(100, Number(progress) || 0));
          document.getElementById('stage').textContent = String(label || 'KNOUX Player X');
          document.getElementById('percent').textContent = `${Math.round(safeProgress)}%`;
          document.getElementById('progress-bar').style.width = `${safeProgress}%`;
          document.querySelector('.progress').setAttribute('aria-valuenow', String(Math.round(safeProgress)));
        };

        window.addEventListener('error', () => {
          document.getElementById('stage').textContent = isArabic ? 'تعذر إكمال بدء التشغيل' : 'Startup could not be completed';
        });
      })();
    </script>
  </body>
</html>
