name: Temporary Windows Verification Identity Repair

on:
  push:
    branches:
      - codex/absolute-final-product-closure-20260908

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Repair active Windows verification literals
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = '.github/workflows/full-rebuild-windows.yml';
          let text = fs.readFileSync(file, 'utf8');
          const replacements = [
            ["out\\KNOUX Player X-win32-x64\\knoux-player-x.exe", "out\\Knoux X-win32-x64\\knoux-player-x.exe"],
            ["$settingsDocument.product -ne 'KNOUX Player X'", "$settingsDocument.product -ne 'Knoux X'"],
          ];
          let changed = 0;
          for (const [from, to] of replacements) {
            const occurrences = text.split(from).length - 1;
            if (occurrences !== 1) throw new Error(`Expected exactly one occurrence of ${from}; found ${occurrences}`);
            text = text.replace(from, to);
            changed++;
          }
          fs.writeFileSync(file, text, 'utf8');
          console.log(`Applied ${changed} targeted Windows verification repairs.`);
          NODE

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/full-rebuild-windows.yml
          git commit -m "fix(ci): align Windows verification with Knoux X identity"
          git push origin HEAD:${{ github.ref_name }}
