name: KNOUX Closure Beauty Auto Analysis

on:
  push:
    branches:
      - codex/absolute-final-product-closure-20260908
    paths:
      - '.github/closure/apply-beauty-auto-analysis.marker'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/absolute-final-product-closure-20260908
          fetch-depth: 0

      - name: Apply automatic local face analysis state machines
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          image_editor = 'src/features/image-editor/ImageEditorView.tsx'
          old = '''  const handleFaceAnalysis = useCallback(async (): Promise<void> => {
    if (!source || !hasDocument) return;
    const client = faceAnalysisClientRef.current;
    if (!client) {
      setFaceAnalysis({ status: 'model-unavailable', modelId: 'mediapipe-face-landmarker', reason: t('imageEditor.faceAnalysisUnavailable') });
      return;
    }
    setFaceAnalysisBusy(true);
    try {
      const result = await client.analyze({
        imageDataUrl: source.dataUrl,
        imageWidth: documentWidth,
        imageHeight: documentHeight,
        maxFaces: 8,
      });
      setFaceAnalysis(result);
      setSelectedFaceId(result.status === 'ready' ? result.faces[0]?.id ?? null : null);
    } finally {
      setFaceAnalysisBusy(false);
    }
  }, [documentHeight, documentWidth, hasDocument, source, t]);
'''
          new = '''  const analyzedFaceSourceRef = useRef<string | null>(null);

  const handleFaceAnalysis = useCallback(async (): Promise<void> => {
    if (!source || !hasDocument) return;
    const client = faceAnalysisClientRef.current;
    if (!client) {
      setFaceAnalysis({ status: 'model-unavailable', modelId: 'mediapipe-face-landmarker', reason: t('imageEditor.faceAnalysisUnavailable') });
      return;
    }
    setFaceAnalysisBusy(true);
    try {
      const result = await client.analyze({
        imageDataUrl: source.dataUrl,
        imageWidth: documentWidth,
        imageHeight: documentHeight,
        maxFaces: 8,
      });
      setFaceAnalysis(result);
      setSelectedFaceId(result.status === 'ready' ? result.faces[0]?.id ?? null : null);
      analyzedFaceSourceRef.current = source.dataUrl;
    } catch (reason) {
      setFaceAnalysis({
        status: 'failed',
        modelId: 'mediapipe-face-landmarker',
        reason: reason instanceof Error ? reason.message : t('imageEditor.faceAnalysisUnavailable'),
      });
      analyzedFaceSourceRef.current = source.dataUrl;
    } finally {
      setFaceAnalysisBusy(false);
    }
  }, [documentHeight, documentWidth, hasDocument, source, t]);

  useEffect(() => {
    if (!source || !hasDocument || faceAnalysisBusy || analyzedFaceSourceRef.current === source.dataUrl) return;
    // Face analysis is a normal background readiness step, not a user command.
    // The local model is invoked once per source image and its reusable landmarks
    // are cached by FaceAnalysisClient/retouch state for makeup slider updates.
    void handleFaceAnalysis();
  }, [faceAnalysisBusy, handleFaceAnalysis, hasDocument, source]);

  useEffect(() => {
    analyzedFaceSourceRef.current = null;
    setFaceAnalysis(null);
    setSelectedFaceId(null);
  }, [source?.dataUrl]);
'''
          replace_once(image_editor, old, new)

          ext = 'src/platform/AndroidBeautyExtension.tsx'
          replace_once(
              ext,
              "type SmartBeautyTool =\n",
              "type BeautyAnalysisState = 'IDLE' | 'QUEUED' | 'ANALYZING' | 'READY' | 'NO_FACE' | 'MODEL_UNAVAILABLE' | 'ERROR';\n\ntype SmartBeautyTool =\n",
          )
          replace_once(
              ext,
              "    const findHost = (): void => setHost(document.querySelector<HTMLElement>('.image-editor-retouch-studio'));",
              "    const findHost = (): void => setHost(document.querySelector<HTMLElement>('[data-android-beauty-host]') ?? document.querySelector<HTMLElement>('.image-editor-retouch-studio'));",
          )
          replace_once(
              ext,
              "  const [analysis, setAnalysis] = useState<FaceAnalysisResult | null>(null);\n  const [selectedFaceId, setSelectedFaceId] = useState<string | null>(null);",
              "  const [analysis, setAnalysis] = useState<FaceAnalysisResult | null>(null);\n  const [analysisState, setAnalysisState] = useState<BeautyAnalysisState>('IDLE');\n  const [selectedFaceId, setSelectedFaceId] = useState<string | null>(null);",
          )
          replace_once(
              ext,
              "  const clientRef = useRef<FaceAnalysisClient | null>(null);",
              "  const clientRef = useRef<FaceAnalysisClient | null>(null);\n  const analyzedSourceRef = useRef<string | null>(null);",
          )
          replace_once(
              ext,
              "  useEffect(() => {\n    setAnalysis(null);\n    setSelectedFaceId(null);\n    setMessage(null);\n  }, [source?.dataUrl]);",
              "  useEffect(() => {\n    analyzedSourceRef.current = null;\n    setAnalysis(null);\n    setAnalysisState(source ? 'QUEUED' : 'IDLE');\n    setSelectedFaceId(null);\n    setMessage(source ? (arabic ? 'جارٍ تجهيز اكتشاف الوجه…' : 'Preparing face detection…') : null);\n  }, [arabic, source?.dataUrl]);",
          )
          replace_once(
              ext,
              "    setBusy(true);\n    setMessage(arabic ? 'جاري تحليل الوجه محليًا…' : 'Analyzing face locally…');",
              "    setBusy(true);\n    setAnalysisState('ANALYZING');\n    setMessage(arabic ? 'جاري اكتشاف الوجه محليًا…' : 'Detecting face locally…');",
          )
          replace_once(
              ext,
              "      setAnalysis(result);\n      if (result.status === 'ready') {\n        setSelectedFaceId((current) => result.faces.some((face) => face.id === current) ? current : result.faces[0]?.id ?? null);\n        setMessage(result.faces.length > 0\n          ? (arabic ? `تم اكتشاف ${result.faces.length} وجه.` : `${result.faces.length} face(s) detected.`)\n          : (arabic ? 'لم يتم اكتشاف وجه واضح.' : 'No clear face was detected.'));\n      } else {\n        setMessage(result.reason);\n      }\n      return result;\n    } catch (error) {\n      const text = error instanceof Error ? error.message : String(error);\n      setMessage(text);\n      return null;",
              "      setAnalysis(result);\n      analyzedSourceRef.current = source?.dataUrl ?? null;\n      if (result.status === 'ready') {\n        const hasFaces = result.faces.length > 0;\n        setAnalysisState(hasFaces ? 'READY' : 'NO_FACE');\n        setSelectedFaceId((current) => result.faces.some((face) => face.id === current) ? current : result.faces[0]?.id ?? null);\n        setMessage(hasFaces\n          ? (arabic ? 'الوجه جاهز' : 'Face ready')\n          : (arabic ? 'تعذر اكتشاف وجه واضح. يمكنك استخدام أدوات الصورة اليدوية.' : 'Face could not be detected clearly. Manual photo tools remain available.'));\n      } else {\n        setAnalysisState(result.status === 'model-unavailable' ? 'MODEL_UNAVAILABLE' : 'ERROR');\n        setMessage(result.reason);\n      }\n      return result;\n    } catch (error) {\n      analyzedSourceRef.current = source?.dataUrl ?? null;\n      setAnalysisState('ERROR');\n      const text = error instanceof Error ? error.message : String(error);\n      setMessage(text);\n      return null;",
          )
          # analyze callback now reads source for the cache key
          replace_once(ext, "  }, [arabic]);\n\n  const selectedFace", "  }, [arabic, source?.dataUrl]);\n\n  useEffect(() => {\n    if (!source || busy || analysisState === 'ANALYZING' || analyzedSourceRef.current === source.dataUrl) return;\n    const canvas = document.querySelector<HTMLCanvasElement>('.image-editor-canvas');\n    if (canvas && canvas.width > 1 && canvas.height > 1 && clientRef.current) {\n      void analyze();\n      return;\n    }\n    const observer = new MutationObserver(() => {\n      const nextCanvas = document.querySelector<HTMLCanvasElement>('.image-editor-canvas');\n      if (!nextCanvas || nextCanvas.width < 2 || nextCanvas.height < 2 || !clientRef.current || analyzedSourceRef.current === source.dataUrl) return;\n      observer.disconnect();\n      void analyze();\n    });\n    observer.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['width', 'height'] });\n    return () => observer.disconnect();\n  }, [analysisState, analyze, busy, source]);\n\n  const selectedFace")
          replace_once(
              ext,
              "        <button type=\"button\" onClick={() => void analyze()} disabled={!source || busy}>\n          {busy ? (arabic ? 'تحليل…' : 'Analyzing…') : (arabic ? 'تحليل الوجه' : 'Analyze Face')}\n        </button>",
              "        <span className={`android-smart-beauty__analysis-state is-${analysisState.toLowerCase()}`} role=\"status\">\n          {analysisState === 'ANALYZING' || analysisState === 'QUEUED'\n            ? (arabic ? 'اكتشاف الوجه…' : 'Detecting face…')\n            : analysisState === 'READY'\n              ? (arabic ? 'الوجه جاهز' : 'Face ready')\n              : analysisState === 'NO_FACE'\n                ? (arabic ? 'لا يوجد وجه واضح' : 'No clear face')\n                : analysisState === 'MODEL_UNAVAILABLE'\n                  ? (arabic ? 'النموذج غير متاح' : 'Model unavailable')\n                  : analysisState === 'ERROR'\n                    ? (arabic ? 'إعادة المحاولة' : 'Retry available')\n                    : (arabic ? 'محلي بالكامل' : 'Local only')}\n        </span>",
          )

          # Emit state on the host for deterministic E2E without exposing landmarks in normal UI.
          replace_once(
              ext,
              "    <section className=\"android-smart-beauty\" aria-label={arabic ? 'أدوات جمال أندرويد الذكية' : 'Android smart beauty tools'}>",
              "    <section className=\"android-smart-beauty\" data-analysis-state={analysisState} data-face-count={analysis?.status === 'ready' ? analysis.faces.length : 0} aria-label={arabic ? 'أدوات جمال أندرويد الذكية' : 'Android smart beauty tools'}>",
          )
          PY

      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KNOUX Closure Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/closure-beauty-auto-analysis.yml .github/closure/apply-beauty-auto-analysis.marker
          git add src/features/image-editor/ImageEditorView.tsx src/platform/AndroidBeautyExtension.tsx
          git commit -m 'feat(beauty): auto-run local face analysis and expose readiness state'
          git push origin HEAD:codex/absolute-final-product-closure-20260908
