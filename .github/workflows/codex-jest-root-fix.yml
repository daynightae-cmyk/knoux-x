name: Codex canonical select repair

on:
  push:
    branches:
      - codex/absolute-final-product-closure-20260908

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout execution branch
        uses: actions/checkout@v4
        with:
          ref: codex/absolute-final-product-closure-20260908
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Restore test/runtime binaries
        run: npm rebuild electron ffmpeg-static @derhuerst/ffprobe-static sharp --foreground-scripts

      - name: Replace native media sort select with canonical NeonSelect
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/features/library/MobileMediaLibraryView.tsx')
          text = path.read_text(encoding='utf-8')

          import_anchor = "import { BrandMark } from '../../components/brand/BrandMark';\n"
          import_replacement = import_anchor + "import { NeonSelect } from '../../components/neon/NeonSelect';\n"
          if "../../components/neon/NeonSelect" not in text:
              if import_anchor not in text:
                  raise SystemExit('BrandMark import anchor changed; refusing stale patch')
              text = text.replace(import_anchor, import_replacement, 1)

          old = '''          <select aria-label={ar ? 'ترتيب' : 'Sort'} value={sort} onChange={(event) => setSort(event.currentTarget.value as SortMode)}>
            <option value="name">{ar ? 'الاسم' : 'Name'}</option>
            <option value="size">{ar ? 'الحجم' : 'Size'}</option>
            <option value="duration">{ar ? 'المدة' : 'Duration'}</option>
          </select>'''
          new = '''          <NeonSelect
            aria-label={ar ? 'ترتيب' : 'Sort'}
            className="kml-sort-select"
            dir={ar ? 'rtl' : 'ltr'}
            value={sort}
            onChange={(value) => setSort(value as SortMode)}
            options={[
              { value: 'name', label: ar ? 'الاسم' : 'Name' },
              { value: 'size', label: ar ? 'الحجم' : 'Size' },
              { value: 'duration', label: ar ? 'المدة' : 'Duration' },
            ]}
          />'''
          if old not in text:
              raise SystemExit('Native sort select no longer matches inspected HEAD; refusing stale patch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          rm -f .github/codex-jest-diagnostic.txt .github/codex-jest-trigger.txt

      - name: TypeScript gate
        run: npm run typecheck

      - name: ESLint gate
        run: npm run lint -- --max-warnings=0

      - name: Jest gate
        run: npm test -- --runInBand

      - name: Commit validated source repair and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/codex-jest-root-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(library): use canonical NeonSelect for media sorting"
          git push origin HEAD:codex/absolute-final-product-closure-20260908
