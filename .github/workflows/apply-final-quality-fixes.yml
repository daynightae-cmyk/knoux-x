name: Apply KNOUX final quality fixes

on:
  push:
    branches:
      - codex/knoux-player-x-full-rebuild
    paths:
      - tools/fix-final-quality-gates.cjs
      - .github/workflows/apply-final-quality-fixes.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-knoux-final-quality-fixes
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/codex/knoux-player-x-full-rebuild'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/knoux-player-x-full-rebuild
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2

      - name: Apply deterministic quality repairs
        run: node tools/fix-final-quality-gates.cjs

      - name: Commit quality repairs
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw 'Quality repair produced no changes.' }
          git commit -m 'fix: close final TypeScript and ESLint quality gates'
          git push origin HEAD:codex/knoux-player-x-full-rebuild
