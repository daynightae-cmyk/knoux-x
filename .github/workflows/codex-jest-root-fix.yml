name: Codex canonical select repair

on:
  push:
    branches:
      - codex/absolute-final-product-closure-20260908

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout execution branch
        uses: actions/checkout@v4
        with:
          ref: codex/absolute-final-product-closure-20260908
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Restore test/runtime binaries
        run: npm rebuild electron ffmpeg-static @derhuerst/ffprobe-static sharp --foreground-scripts

      - name: Replace native media sort select with canonical NeonSelect
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/features/library/MobileMediaLibraryView.tsx')
          text = path.read_text(encoding='utf-8')

          import_anchor = "import { BrandMark } from '../../components/brand/BrandMark';\n"
          if "../../components/neon/NeonSelect" not in text:
              if import_anchor not in text:
                  raise SystemExit('BrandMark import anchor changed; refusing stale patch')
              text = text.replace(import_anchor, import_anchor + "import { NeonSelect } from '../../components/neon/NeonSelect';\n", 1)

          pattern = re.compile(r"(?m)^(?P<indent>\s*)<select aria-label=\{ar \? 'ترتيب' : 'Sort'\} value=\{sort\} onChange=\{\(event\) => setSort\(event\.currentTarget\.value as SortMode\)\}>\n(?:(?P=indent)  <option[^\n]+\n){3}(?P=indent)</select>$")
          match = pattern.search(text)
          if match is None:
              raise SystemExit('Native sort select no longer matches inspected structure; refusing stale patch')
          indent = match.group('indent')
          replacement = "\n".join([
              f"{indent}<NeonSelect",
              f"{indent}  aria-label={{ar ? 'ترتيب' : 'Sort'}}",
              f"{indent}  className=\"kml-sort-select\"",
              f"{indent}  dir={{ar ? 'rtl' : 'ltr'}}",
              f"{indent}  value={{sort}}",
              f"{indent}  onChange={{(value) => setSort(value as SortMode)}}",
              f"{indent}  options={{[",
              f"{indent}    {{ value: 'name', label: ar ? 'الاسم' : 'Name' }},",
              f"{indent}    {{ value: 'size', label: ar ? 'الحجم' : 'Size' }},",
              f"{indent}    {{ value: 'duration', label: ar ? 'المدة' : 'Duration' }},",
              f"{indent}  ]}}",
              f"{indent}/>",
          ])
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one native sort select, replaced {count}')
          path.write_text(text, encoding='utf-8')
          PY

          rm -f .github/codex-jest-diagnostic.txt .github/codex-jest-trigger.txt

      - name: Persist source repair before validation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/features/library/MobileMediaLibraryView.tsx .github/codex-jest-diagnostic.txt .github/codex-jest-trigger.txt 2>/dev/null || true
          git add -u .github
          if ! git diff --cached --quiet; then
            git commit -m "fix(library): use canonical NeonSelect for media sorting"
            git push origin HEAD:codex/absolute-final-product-closure-20260908
          fi

      - name: TypeScript gate
        run: npm run typecheck

      - name: ESLint gate
        run: npm run lint -- --max-warnings=0

      - name: Jest gate with diagnostic capture
        id: jest
        shell: bash
        run: |
          set +e
          npm test -- --runInBand 2>&1 | tee /tmp/jest.log
          status=${PIPESTATUS[0]}
          python - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/jest.log').read_text(encoding='utf-8', errors='replace').splitlines()
          needles = ('FAIL ', 'Expected:', 'Received:', 'Test Suites:', 'Tests:', 'Snapshots:', 'Time:', 'Ran all test suites', '● ')
          selected = []
          for index, line in enumerate(lines):
              if any(needle in line for needle in needles):
                  start = max(0, index - 5)
                  end = min(len(lines), index + 14)
                  selected.extend(lines[start:end])
          if not selected:
              selected = lines[-220:]
          compact = []
          previous = None
          for line in selected:
              if line != previous:
                  compact.append(line)
              previous = line
          Path('jest-diagnostic.txt').write_text('\n'.join(compact[-800:]) + '\n', encoding='utf-8')
          PY
          exit "$status"

      - name: Upload Jest diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-jest-diagnostic
          path: jest-diagnostic.txt
          if-no-files-found: warn
          retention-days: 1
