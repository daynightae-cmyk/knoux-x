name: Knoux X — Release All Platforms

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Draft validates everything without publishing; publish creates the public release.'
        required: true
        default: 'draft'
        type: choice
        options:
          - draft
          - publish
      release_notes:
        description: 'Optional extra release notes (appended to generated notes).'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: knoux-x-production-release
  cancel-in-progress: false

env:
  CAPACITOR_VERSION: '8.5.0'

jobs:
  preflight:
    name: Pre-flight and release identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.identity.outputs.version }}
      version_code: ${{ steps.identity.outputs.version_code }}
      tag: ${{ steps.identity.outputs.tag }}
      sha: ${{ steps.sha.outputs.sha }}
      built_at: ${{ steps.sha.outputs.built_at }}
      publish: ${{ steps.mode.outputs.publish }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # No git push happens anywhere in this workflow (releases go
          # through the gh API), so credentials must not be persisted:
          # otherwise the canonical remote-URL check below compares
          # against a token-embedded URL and fails closed.
          persist-credentials: false

      - name: Verify canonical repository
        shell: bash
        run: |
          url="$(git config --get remote.origin.url)"
          if [ "$url" != "https://github.com/daynightae-cmyk/knoux-x.git" ]; then
            echo "REMOTE_URL_MISMATCH url=$(printf '%s' "$url" | sed 's#://[^@]*@#://***@#')"
            exit 1
          fi
          test "${{ github.repository }}" = "daynightae-cmyk/knoux-x"

      - name: Record source SHA
        id: sha
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Resolve release identity
        id: identity
        shell: bash
        run: |
          eval "$(node tools/knoux-release-version.cjs)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$versionCode" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_title=$releaseTitle" >> "$GITHUB_OUTPUT"
          echo "windows_setup=$windowsSetupName" >> "$GITHUB_OUTPUT"
          echo "android_apk=$androidApkName" >> "$GITHUB_OUTPUT"
          echo "android_aab=$androidAabName" >> "$GITHUB_OUTPUT"
          echo "checksums=$checksumsName" >> "$GITHUB_OUTPUT"
          echo "manifest=$manifestName" >> "$GITHUB_OUTPUT"

      - name: Enforce tag and version agreement
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            test "${{ github.ref_name }}" = "${{ steps.identity.outputs.tag }}"
          fi

      - name: Resolve publish mode
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ inputs.mode }}" == "publish" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require committed deterministic lockfile
        shell: bash
        run: test -s package-lock.json

  quality:
    name: Shared quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [preflight]
    env:
      KNOUX_RELEASE_SHA: ${{ needs.preflight.outputs.sha }}
      KNOUX_RELEASE_BUILT_AT: ${{ needs.preflight.outputs.built_at }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Restore test/runtime binaries
        run: npm rebuild electron ffmpeg-static @derhuerst/ffprobe-static sharp --foreground-scripts

      - name: Verify official brand sources
        run: npm run brand:verify

      - name: TypeScript gate
        run: npm run typecheck

      - name: ESLint gate
        run: npm run lint -- --max-warnings=0

      - name: Unit test gate
        run: npm test -- --runInBand

      - name: Build web renderer from release SHA
        run: npx vite build --config vite.renderer.config.ts --outDir dist

      - name: Stamp release identity into web bundle
        shell: bash
        run: |
          grep -o '"version":"[0-9]*\.[0-9]*\.[0-9]*"' dist/assets/*.js | head -2
          grep -o '[0-9a-f]\{40\}' dist/assets/*.js | grep -i '${{ needs.preflight.outputs.sha }}' | head -1

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: knoux-web-dist-${{ needs.preflight.outputs.sha }}
          path: dist/
          retention-days: 30

  windows:
    name: Windows production build
    runs-on: windows-2022
    timeout-minutes: 120
    needs: [preflight, quality]
    outputs:
      signing: ${{ steps.signing.outputs.status }}
      setup_sha256: ${{ steps.hashes.outputs.setup_sha256 }}
    env:
      KNOUX_RELEASE_SHA: ${{ needs.preflight.outputs.sha }}
      KNOUX_RELEASE_BUILT_AT: ${{ needs.preflight.outputs.built_at }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure native toolchain
        shell: pwsh
        run: |
          $python = (Get-Command python -ErrorAction Stop).Source
          "npm_config_python=$python" >> $env:GITHUB_ENV
          "npm_config_msvs_version=2022" >> $env:GITHUB_ENV

      - name: Install deterministic dependencies
        run: npm ci --no-audit --no-fund

      - name: Rebuild Electron native modules
        shell: pwsh
        run: npm exec electron-rebuild -- -f --only better-sqlite3,sharp

      - name: Package and make Squirrel installer
        shell: pwsh
        run: |
          npm run package -- --arch=x64
          npm run make -- --arch=x64

      - name: Collect installer and update files
        id: collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-windows -Force | Out-Null
          $squirrel = Get-ChildItem 'out\make\squirrel.windows\x64' -File -Filter '*Setup.exe'
          if ($squirrel.Count -ne 1) { throw "Expected one Setup.exe, found $($squirrel.Count)." }
          $setup = $squirrel[0]
          if ($setup.Length -le 1MB) { throw 'Setup.exe payload unexpectedly small.' }
          Copy-Item -LiteralPath $setup.FullName -Destination "release-windows\${{ needs.preflight.outputs.windows_setup }}" -Force
          Copy-Item -LiteralPath $setup.FullName -Destination 'release-windows\' -Force
          Copy-Item -LiteralPath 'out\make\squirrel.windows\x64\*.nupkg' -Destination 'release-windows\' -Force
          Copy-Item -LiteralPath 'out\make\squirrel.windows\x64\RELEASES' -Destination 'release-windows\' -Force
          Get-ChildItem release-windows | Format-Table Name, Length

      - name: Verify packaged resources
        shell: pwsh
        run: |
          $exe = Get-Item -LiteralPath 'out\Knoux X-win32-x64\knoux-player-x.exe'
          if (-not $exe -or $exe.Length -le 0) { throw 'Packaged executable missing.' }
          $resources = Join-Path $exe.Directory.FullName 'resources'
          $ffmpeg = Get-ChildItem $resources -Recurse -Filter 'ffmpeg.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          $ffprobe = Get-ChildItem $resources -Recurse -Filter 'ffprobe.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw 'Packaged media tools missing.' }
          & $ffmpeg.FullName -version | Select-Object -First 1
          & $ffprobe.FullName -version | Select-Object -First 1

      - name: Packaged launch and settings smoke
        shell: pwsh
        run: |
          $exe = Get-Item -LiteralPath 'out\Knoux X-win32-x64\knoux-player-x.exe'
          $evidence = Join-Path $PWD 'release-windows\packaged-settings-persistence.json'
          $test = Start-Process -FilePath $exe.FullName -ArgumentList @('--settings-self-test', "--settings-evidence=$evidence") -Wait -PassThru -WindowStyle Hidden
          if ($test.ExitCode -ne 0 -or -not (Test-Path $evidence)) { throw "Settings self-test failed: $($test.ExitCode)." }
          Get-Process -Name 'knoux-player-x' -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Report Authenticode signing truth
        id: signing
        shell: pwsh
        run: |
          $setup = Get-Item -LiteralPath "release-windows\${{ needs.preflight.outputs.windows_setup }}"
          $signature = Get-AuthenticodeSignature -FilePath $setup.FullName
          $status = if ($signature.Status -eq 'Valid') { 'configured' } else { 'not-configured' }
          "status=$status" >> $env:GITHUB_OUTPUT
          "signature=$($signature.Status)" >> $env:GITHUB_OUTPUT
          Write-Host "WINDOWS PRODUCTION CODE SIGNING: $status ($($signature.Status))"

      - name: Hash release files
        id: hashes
        shell: pwsh
        run: |
          $setup = Get-Item -LiteralPath "release-windows\${{ needs.preflight.outputs.windows_setup }}"
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          "setup_sha256=$hash" >> $env:GITHUB_OUTPUT
          Get-ChildItem release-windows -File | Get-FileHash -Algorithm SHA256 | Format-Table Path, Hash

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: knoux-windows-${{ needs.preflight.outputs.sha }}
          path: release-windows/
          retention-days: 30

  android:
    name: Android production build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: [preflight, quality]
    # The production signing material lives only in this environment. Without
    # the reference the secrets are not even reachable from the job, which is how
    # a release can silently end up signed by a disposable key.
    environment: android-production
    outputs:
      signing: ${{ steps.signing.outputs.status }}
      certificate_sha256: ${{ steps.signing.outputs.certificate_sha256 }}
      apk_sha256: ${{ steps.hashes.outputs.apk_sha256 }}
      aab_sha256: ${{ steps.hashes.outputs.aab_sha256 }}
    env:
      KNOUX_RELEASE_SHA: ${{ needs.preflight.outputs.sha }}
      KNOUX_RELEASE_BUILT_AT: ${{ needs.preflight.outputs.built_at }}
      KNOUX_RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Ensure Android API 36 SDK
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install pinned Capacitor tooling
        run: >-
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund
          @capacitor/core@${CAPACITOR_VERSION}
          @capacitor/cli@${CAPACITOR_VERSION}
          @capacitor/android@${CAPACITOR_VERSION}

      - name: Build renderer and generate Android project
        shell: bash
        run: |
          npx vite build --config vite.renderer.config.ts --outDir dist
          rm -rf android
          npx cap add android
          npx cap sync android
          # Production packaging contract, enforced before Gradle sees the tree:
          # no WebView debugging, no cloud backup of private data, no source maps.
          node tools/configure-android-webview-debugging.cjs android production
          node tools/harden-android-manifest.cjs android
          if find android/app/src/main/assets/public -name '*.map' -print -quit | grep -q .; then
            echo 'Published release assets contain source maps; refusing to package readable sources.' >&2
            exit 1
          fi

      - name: Install native foundations, permissions, branding
        shell: bash
        run: |
          node tools/prepare-android-native-media.cjs
          node tools/prepare-android-functional-closure.cjs
          node tools/prepare-android-branding.cjs
          node tools/prepare-android-premium-splash.cjs

      - name: Build release APK and AAB
        shell: bash
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Decide the signing identity before building
        id: identity
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KNOUX_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KNOUX_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KNOUX_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KNOUX_ANDROID_KEY_PASSWORD }}
          CERT_SHA256: ${{ secrets.KNOUX_ANDROID_CERT_SHA256 }}
          PUBLISH: ${{ needs.preflight.outputs.publish }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$KEYSTORE_BASE64" ] || missing+=("KNOUX_ANDROID_KEYSTORE_BASE64")
          [ -n "$KEYSTORE_PASSWORD" ] || missing+=("KNOUX_ANDROID_KEYSTORE_PASSWORD")
          [ -n "$KEY_ALIAS" ] || missing+=("KNOUX_ANDROID_KEY_ALIAS")
          [ -n "$KEY_PASSWORD" ] || missing+=("KNOUX_ANDROID_KEY_PASSWORD")
          [ -n "$CERT_SHA256" ] || missing+=("KNOUX_ANDROID_CERT_SHA256")
          # A publishable run has exactly one permissible identity. Falling back to
          # a disposable CI key here would put an un-updatable signature in front of
          # users, so an incomplete secret set is a hard stop, never a soft default.
          if [ "${#missing[@]}" -gt 0 ]; then
            if [ "$PUBLISH" = "true" ]; then
              echo "::error::PRODUCTION_SECRETS_INCOMPLETE: ${missing[*]} are not configured in the android-production environment. Refusing to publish."
              echo "PRODUCTION_SECRETS_INCOMPLETE: ${missing[*]}" > "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "status=ci" >> "$GITHUB_OUTPUT"
            echo "Production signing material is incomplete (${missing[*]}); this build is CI-signed and cannot be published."
            exit 0
          fi
          echo "status=production" >> "$GITHUB_OUTPUT"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/knoux-production.p12"
          chmod 600 "$RUNNER_TEMP/knoux-production.p12"
          echo "keystore=$RUNNER_TEMP/knoux-production.p12" >> "$GITHUB_OUTPUT"
          echo "Production signing material is present. Values are not logged."

      - name: Verify the production signing identity
        if: steps.identity.outputs.status == 'production'
        env:
          KNOUX_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KNOUX_ANDROID_KEYSTORE_PASSWORD }}
          KNOUX_ANDROID_KEY_PASSWORD: ${{ secrets.KNOUX_ANDROID_KEY_PASSWORD }}
          KNOUX_ANDROID_CERT_SHA256: ${{ secrets.KNOUX_ANDROID_CERT_SHA256 }}
          KNOUX_ANDROID_KEY_ALIAS: ${{ secrets.KNOUX_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          # Written inside release-android/ so the identity evidence is uploaded
          # with the artifacts it describes, instead of vanishing with the runner.
          mkdir -p release-android
          node tools/verify-production-signing-identity.cjs \
            --keystore "${{ steps.identity.outputs.keystore }}" \
            --storepass-env KNOUX_ANDROID_KEYSTORE_PASSWORD \
            --keypass-env KNOUX_ANDROID_KEY_PASSWORD \
            --alias "$KNOUX_ANDROID_KEY_ALIAS" \
            --storetype PKCS12 \
            --pin-env KNOUX_ANDROID_CERT_SHA256 \
            --allow-ci-identity false \
            --out release-android/production-signing-identity.json
          cat release-android/production-signing-identity.json

      - name: Sign APK and AAB with the resolved identity
        id: signing
        shell: bash
        # This step reads app/build/outputs/... and writes ../release-android, so
        # it must run inside the Gradle project. Every later step addresses the
        # same directory as release-android/ from the workspace root; without this
        # line the unsigned artifacts are not found and the output escapes the
        # checkout entirely, which is why this job could never have completed.
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KNOUX_ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KNOUX_ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KNOUX_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p ../release-android
          APKSIGNER="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          UNSIGNED_AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$UNSIGNED_APK"
          test -s "$UNSIGNED_AAB"
          if [ "${{ steps.identity.outputs.status }}" = "production" ]; then
            STORE="${{ steps.identity.outputs.keystore }}"
            STORE_TYPE=PKCS12
            ALIAS_ENV=KEY_ALIAS
            KS_PASS="env:KEYSTORE_PASSWORD"
            KEY_PASS="env:KEY_PASSWORD"
            JARSIGNER_STORE_PASS_ENV=KEYSTORE_PASSWORD
            JARSIGNER_KEY_PASS_ENV=KEY_PASSWORD
          else
            # Draft-only identity. It is never allowed to reach a public release,
            # and it is deliberately not reusable as a production keystore.
            STORE="$RUNNER_TEMP/knoux-release-ci.jks"
            STORE_TYPE=JKS
            export KNOWN_CI_RELEASE_PASS='knoux-ci-release-2026'
            ALIAS_ENV=KNOWN_CI_RELEASE_ALIAS
            export KNOWN_CI_RELEASE_ALIAS=knoux-ci-release
            KS_PASS="env:KNOWN_CI_RELEASE_PASS"
            KEY_PASS="env:KNOWN_CI_RELEASE_PASS"
            JARSIGNER_STORE_PASS_ENV=KNOWN_CI_RELEASE_PASS
            JARSIGNER_KEY_PASS_ENV=KNOWN_CI_RELEASE_PASS
            rm -f "$STORE"
            keytool -genkeypair -keystore "$STORE" -storetype JKS -alias "$KNOWN_CI_RELEASE_ALIAS" \
              -keyalg RSA -keysize 3072 -validity 3650 \
              -dname 'CN=Knoux X CI Release Verification, OU=CI, O=Knoux X, C=AE' \
              -storepass:env KNOWN_CI_RELEASE_PASS -keypass:env KNOWN_CI_RELEASE_PASS
          fi
          "$APKSIGNER" sign --ks "$STORE" --ks-type "$STORE_TYPE" --ks-key-alias "${!ALIAS_ENV}" \
            --ks-pass "$KS_PASS" --key-pass "$KEY_PASS" \
            --out "../release-android/${{ needs.preflight.outputs.android_apk }}" "$UNSIGNED_APK"
          jarsigner -keystore "$STORE" -storetype "$STORE_TYPE" \
            -storepass:env "$JARSIGNER_STORE_PASS_ENV" -keypass:env "$JARSIGNER_KEY_PASS_ENV" \
            -signedjar "../release-android/${{ needs.preflight.outputs.android_aab }}" "$UNSIGNED_AAB" "${!ALIAS_ENV}"
          "$APKSIGNER" verify --verbose --print-certs "../release-android/${{ needs.preflight.outputs.android_apk }}" | tee ../release-android/android-signing.txt
          jarsigner -verify -certs "../release-android/${{ needs.preflight.outputs.android_aab }}" | tee -a ../release-android/android-signing.txt
          CERT_SHA="$(awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2; exit}' ../release-android/android-signing.txt | tr -d '[:space:]' | tr 'A-F' 'a-f')"
          if [ -z "$CERT_SHA" ]; then
            echo "::error::The published APK has no readable signer certificate."
            exit 1
          fi
          echo "certificate_sha256=$CERT_SHA" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.identity.outputs.status }}" = "production" ]; then
            EXPECTED="$(printf '%s' "${{ secrets.KNOUX_ANDROID_CERT_SHA256 }}" | tr -d ':\n' | tr 'A-F' 'a-f')"
            if [ "$CERT_SHA" != "$EXPECTED" ]; then
              echo "::error::Published APK is signed by $CERT_SHA, not the pinned $EXPECTED. Refusing to publish."
              exit 1
            fi
            AAB_CERT="$(mktemp)"; unzip -p "../release-android/${{ needs.preflight.outputs.android_aab }}" 'META-INF/*.RSA' > "$AAB_CERT" || true
            AAB_SHA="$(keytool -printcert -file "$AAB_CERT" 2>/dev/null | awk -F': ' '/SHA256/ {print $2; exit}' | tr -d '[:space:]' | tr 'A-F' 'a-f')"
            rm -f "$AAB_CERT"
            if [ "$AAB_SHA" != "$EXPECTED" ]; then
              echo "::error::Published AAB is signed by ${AAB_SHA:-none}, not the pinned $EXPECTED. Refusing to publish."
              exit 1
            fi
            echo "Both published artifacts carry the pinned production certificate."
          fi
          echo "status=${{ steps.identity.outputs.status }}" >> "$GITHUB_OUTPUT"

      - name: Verify packaged identity
        shell: bash
        env:
          # A published production APK must not expose WebView debugging.
          KNOUX_ANDROID_EXPECT_WEBVIEW_DEBUG: 'off'
        run: |
          cp android/knoux-branding-report.json release-android/android-branding-report.json
          node tools/verify-android-apk.cjs "release-android/${{ needs.preflight.outputs.android_apk }}" release-android

      - name: Hash release files
        id: hashes
        shell: bash
        run: |
          sha256sum "release-android/${{ needs.preflight.outputs.android_apk }}" | tee "release-android/${{ needs.preflight.outputs.android_apk }}.sha256"
          sha256sum "release-android/${{ needs.preflight.outputs.android_aab }}" | tee "release-android/${{ needs.preflight.outputs.android_aab }}.sha256"
          echo "apk_sha256=$(cut -d' ' -f1 "release-android/${{ needs.preflight.outputs.android_apk }}.sha256")" >> "$GITHUB_OUTPUT"
          echo "aab_sha256=$(cut -d' ' -f1 "release-android/${{ needs.preflight.outputs.android_aab }}.sha256")" >> "$GITHUB_OUTPUT"

      - name: Enable KVM for emulator smoke
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch release APK on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          force-avd-creation: true
          emulator-boot-timeout: 300
          disable-animations: true
          # ANGLE over Mesa llvmpipe: the host SwiftShader GLES translator kills
          # QEMU with "bad color buffer handle" while the WebView creates the
          # video surface. See .github/workflows/android-apk.yml for the runs.
          emulator-options: -no-window -gpu angle_indirect -noaudio -no-boot-anim -no-snapshot -no-snapshot-save -camera-back none -camera-front none
          script: bash tools/android-emulator-smoke.sh release-android/${{ needs.preflight.outputs.android_apk }} dev.knoux.playerx release-android

      - name: Upload Android artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knoux-android-${{ needs.preflight.outputs.sha }}
          path: release-android/
          retention-days: 30

  web:
    name: Web production verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [preflight, quality]
    outputs:
      production: ${{ steps.smoke.outputs.verdict }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false

      - name: Download web bundle
        uses: actions/download-artifact@v4
        with:
          name: knoux-web-dist-${{ needs.preflight.outputs.sha }}
          path: dist/

      - name: Production smoke test
        id: smoke
        shell: bash
        env:
          PRODUCTION_URL: ${{ vars.KNOUX_WEB_PRODUCTION_URL }}
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "verdict=unverified-no-production-url" >> "$GITHUB_OUTPUT"
            echo "KNOUX_WEB_PRODUCTION_URL is not configured; web production is EXTERNAL-CONFIG-BLOCKED."
            exit 0
          fi
          set +e
          node tools/verify-web-production.cjs --url "$PRODUCTION_URL" --sha "${{ needs.preflight.outputs.sha }}" --version "${{ needs.preflight.outputs.version }}" | tee web-production-smoke.json
          code=$?
          set -e
          if [ $code -eq 2 ]; then
            echo "Production serves a stale SHA." >&2
            echo "verdict=stale" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          test $code -eq 0
          echo "verdict=pass" >> "$GITHUB_OUTPUT"

      - name: Upload web evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knoux-web-${{ needs.preflight.outputs.sha }}
          path: |
            dist/
            web-production-smoke.json
          retention-days: 30

  publish:
    name: Publish unified release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [preflight, quality, windows, android, web]
    outputs:
      release_url: ${{ steps.release.outputs.url }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Remove stale draft release for reruns
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ needs.preflight.outputs.tag }}" --json isDraft -q .isDraft 2>/dev/null | grep -q true; then
            gh release delete "${{ needs.preflight.outputs.tag }}" --cleanup-tag -y
          fi

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: knoux-windows-${{ needs.preflight.outputs.sha }}
          path: release-windows/

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: knoux-android-${{ needs.preflight.outputs.sha }}
          path: release-android/

      - name: Refuse a public release that is not production-signed
        shell: bash
        run: |
          set -euo pipefail
          # The last line of defence: even if an earlier step mislabelled its
          # identity, a disposable CI signature can never become a public release.
          if [ "${{ needs.preflight.outputs.publish }}" = "true" ] \
            && [ "${{ needs.android.outputs.signing }}" != "production" ]; then
            echo "::error::PUBLICATION_BLOCKED: Android artifacts are signed with '${{ needs.android.outputs.signing }}', not the pinned production identity."
            exit 1
          fi
          if [ -z "${{ needs.android.outputs.certificate_sha256 }}" ]; then
            echo "::error::PUBLICATION_BLOCKED: no verified signing certificate fingerprint was recorded."
            exit 1
          fi
          echo "Publication identity accepted: ${{ needs.android.outputs.signing }} / ${{ needs.android.outputs.certificate_sha256 }}"

      - name: Enforce same-SHA contract
        shell: bash
        run: |
          test "${{ needs.preflight.outputs.sha }}" = "${{ github.sha }}" || test "${{ github.ref_type }}" = "tag"
          node tools/knoux-release-version.cjs
          echo "RELEASE_SHA=${{ needs.preflight.outputs.sha }}"

      - name: Generate release notes
        shell: bash
        run: |
          PREVIOUS="$(git describe --tags --abbrev=0 HEAD 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          if git rev-parse "$PREVIOUS" >/dev/null 2>&1 && [ "$PREVIOUS" != "$(git rev-parse HEAD)" ]; then
            RANGE="$PREVIOUS..${{ needs.preflight.outputs.sha }}"
          else
            RANGE="${{ needs.preflight.outputs.sha }}"
          fi
          git log "$RANGE" --pretty=format:'%s' > release-subjects.txt
          node -e "
          const fs = require('fs');
          const subjects = fs.readFileSync('release-subjects.txt', 'utf8').split('\n').filter(Boolean);
          const groups = { Features: [], Fixes: [], Android: [], Windows: [], Media: [], AI: [], UI: [], Internal: [] };
          for (const subject of subjects) {
            const lower = subject.toLowerCase();
            if (/android|capacitor|apk|aab|mobile/.test(lower)) groups.Android.push(subject);
            else if (/windows|electron|installer|squirrel/.test(lower)) groups.Windows.push(subject);
            else if (/video|audio|slideshow|retouch|beauty|ffmpeg|media|player/.test(lower)) groups.Media.push(subject);
            else if (/\bai\b|gemini|hugging|replicate|provider|model/.test(lower)) groups.AI.push(subject);
            else if (/^feat/.test(lower) || /glass|theme|splash|brand|viewport|layout/.test(lower)) groups.Features.push(subject);
            else if (/^fix/.test(lower)) groups.Fixes.push(subject);
            else if (/^test|ci\(|chore|docs/.test(lower)) groups.Internal.push(subject);
            else groups.UI.push(subject);
          }
          let notes = '## Knoux X ${{ needs.preflight.outputs.version }}\n\nOne release SHA for Web, Windows and Android: \`${{ needs.preflight.outputs.sha }}\`.\n';
          for (const [name, items] of Object.entries(groups)) {
            if (items.length === 0) continue;
            notes += '\n### ' + name + '\n' + items.slice(0, 40).map((item) => '- ' + item).join('\n') + '\n';
          }
          const extra = process.env.RELEASE_NOTES_EXTRA;
          if (extra) notes += '\n' + extra + '\n';
          fs.writeFileSync('release-notes.md', notes);
          "
        env:
          RELEASE_NOTES_EXTRA: ${{ inputs.release_notes }}

      - name: Build manifest and checksums
        shell: bash
        run: |
          SETUP="release-windows/${{ needs.preflight.outputs.windows_setup }}"
          NUPKG="$(ls release-windows/*.nupkg 2>/dev/null | head -1 || true)"
          RELEASES_FILE="$(ls release-windows/RELEASES 2>/dev/null || true)"
          APK="release-android/${{ needs.preflight.outputs.android_apk }}"
          AAB="release-android/${{ needs.preflight.outputs.android_aab }}"
          ARGS=(--sha "${{ needs.preflight.outputs.sha }}" --built-at "${{ needs.preflight.outputs.built_at }}" --windows-setup "$SETUP" --android-apk "$APK" --windows-signing "${{ needs.windows.outputs.signing }}" --android-signing "${{ needs.android.outputs.signing }}" --web-sha "${{ needs.preflight.outputs.sha }}" --out "release-assets/${{ needs.preflight.outputs.manifest }}")
          if [ -n "$NUPKG" ]; then ARGS+=(--windows-nupkg "$NUPKG"); fi
          if [ -n "$RELEASES_FILE" ]; then ARGS+=(--windows-releases "$RELEASES_FILE"); fi
          if [ -f "$AAB" ]; then ARGS+=(--android-aab "$AAB"); fi
          if [ -n "${{ vars.KNOUX_WEB_PRODUCTION_URL }}" ]; then ARGS+=(--web-url "${{ vars.KNOUX_WEB_PRODUCTION_URL }}"); fi
          mkdir -p release-assets
          node tools/knoux-release-manifest.cjs "${ARGS[@]}"
          (cd release-windows && sha256sum * > "../release-assets/${{ needs.preflight.outputs.checksums }}")
          (cd release-android && sha256sum "${{ needs.preflight.outputs.android_apk }}" "${{ needs.preflight.outputs.android_aab }}" >> "../release-assets/${{ needs.preflight.outputs.checksums }}")

      - name: Create GitHub Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=(--title "Knoux X ${{ needs.preflight.outputs.version }}" --notes-file release-notes.md)
          if [ "${{ needs.preflight.outputs.publish }}" != "true" ]; then FLAGS+=(--draft); fi
          if [ "${{ github.ref_type }}" = "tag" ]; then
            gh release create "${{ needs.preflight.outputs.tag }}" "${FLAGS[@]}" --target "${{ needs.preflight.outputs.sha }}"
          else
            gh release create "${{ needs.preflight.outputs.tag }}" "${FLAGS[@]}" --target "${{ needs.preflight.outputs.sha }}" --draft
          fi
          gh release upload "${{ needs.preflight.outputs.tag }}" \
            "release-assets/${{ needs.preflight.outputs.manifest }}" \
            "release-assets/${{ needs.preflight.outputs.checksums }}" \
            "release-windows/${{ needs.preflight.outputs.windows_setup }}" \
            "release-android/${{ needs.preflight.outputs.android_apk }}" \
            "release-android/${{ needs.preflight.outputs.android_aab }}"
          for extra in release-windows/*.nupkg release-windows/RELEASES; do
            [ -f "$extra" ] && gh release upload "${{ needs.preflight.outputs.tag }}" "$extra"
          done
          echo "url=$(gh release view "${{ needs.preflight.outputs.tag }}" --json url -q .url)" >> "$GITHUB_OUTPUT"

      - name: Release summary
        shell: bash
        run: |
          echo "PRODUCT=Knoux X ${{ needs.preflight.outputs.version }}"
          echo "SHA=${{ needs.preflight.outputs.sha }}"
          echo "WINDOWS_SIGNING=${{ needs.windows.outputs.signing }}"
          echo "ANDROID_SIGNING=${{ needs.android.outputs.signing }}"
          echo "WEB=${{ needs.web.outputs.production }}"
          echo "RELEASE=${{ steps.release.outputs.url }}"
