name: Phase 3A Electron Acceptance TEMP

on:
  push:
    branches:
      - wip/phase3a-runtime-recovery
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase3a-electron-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accept:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CI: 'true'
    steps:
      - name: Checkout exact WIP head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 20.20.2
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure MSVC 2022 native toolchain
        shell: pwsh
        run: |
          $python = (Get-Command python -ErrorAction Stop).Source
          "npm_config_python=$python" >> $env:GITHUB_ENV
          "npm_config_msvs_version=2022" >> $env:GITHUB_ENV
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'MSVC 2022 x64 build tools are missing.' }
          node -v
          npm -v

      - name: Install deterministic dependencies
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed.' }

      - name: Rebuild Electron native modules
        shell: pwsh
        run: |
          npm exec electron-rebuild -- -f --only better-sqlite3,sharp
          if ($LASTEXITCODE -ne 0) { throw 'Electron native-module rebuild failed.' }

      - name: TypeScript gate
        shell: pwsh
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'TypeScript failed.' }

      - name: ESLint zero-warning gate
        shell: pwsh
        run: |
          npm run lint -- --max-warnings=0
          if ($LASTEXITCODE -ne 0) { throw 'ESLint failed.' }

      - name: Focused Phase 3A regression tests
        shell: pwsh
        run: |
          npm test -- --runInBand tests/unit/retouch-phase3-integration.test.ts tests/unit/retouch-phase3-canvas-targeting.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'Focused Phase 3A tests failed.' }

      - name: Full Jest serial gate
        shell: pwsh
        run: |
          npm test -- --runInBand
          if ($LASTEXITCODE -ne 0) { throw 'Full Jest failed.' }

      - name: Package real Electron application
        shell: pwsh
        run: |
          npm run package -- --arch=x64
          if ($LASTEXITCODE -ne 0) { throw 'Electron Forge package failed.' }

      - name: Prepare proven built-runtime launch variant
        shell: pwsh
        run: |
          $file = 'tools\phase3a-electron-acceptance.cjs'
          $text = Get-Content -LiteralPath $file -Raw
          $oldExe = 'const exePath = findPackagedExe();'
          $newExe = "const exePath = path.join(root, 'node_modules', 'electron', 'dist', 'electron.exe'); assert(fs.existsSync(exePath), 'Electron runtime executable is missing.');"
          $oldLaunch = 'app = await electron.launch({ executablePath: exePath, timeout: 60000 });'
          $newLaunch = "console.log('PHASE3A_LAUNCH_START', exePath); app = await electron.launch({ executablePath: exePath, args: [root], cwd: root, timeout: 60000, env: { ...process.env, ELECTRON_ENABLE_LOGGING: '1', ELECTRON_LOG_FILE: path.join(evidenceDir, 'electron.log'), KNOUX_STARTUP_TRACE_FILE: path.join(evidenceDir, 'startup-trace.log') } }); console.log('PHASE3A_LAUNCH_OK');"
          $oldTour = "await page.keyboard.press('Escape').catch(() => undefined);"
          $newTour = "const firstRun = page.locator('.first-run-backdrop'); await firstRun.waitFor({ state: 'visible', timeout: 5000 }).catch(() => undefined); if (await firstRun.isVisible()) { console.log('PHASE3A_DISMISS_FIRST_RUN'); await firstRun.locator('.tour-skip').click(); await firstRun.waitFor({ state: 'hidden', timeout: 10000 }); }"
          if (-not $text.Contains($oldExe)) { throw 'Expected executable selection marker not found.' }
          if (-not $text.Contains($oldLaunch)) { throw 'Expected Electron launch marker not found.' }
          if (-not $text.Contains($oldTour)) { throw 'Expected first-run marker not found.' }
          $text = $text.Replace($oldExe, $newExe).Replace($oldLaunch, $newLaunch).Replace($oldTour, $newTour)
          Set-Content -LiteralPath $file -Value $text -Encoding utf8NoBOM
          Select-String -LiteralPath $file -Pattern 'PHASE3A_LAUNCH_START|PHASE3A_DISMISS_FIRST_RUN|args: \[root\]' | ForEach-Object { $_.Line | Write-Host }

      - name: Run real Electron Phase 3A acceptance
        shell: pwsh
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          node tools/phase3a-electron-acceptance.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Phase 3A Electron acceptance failed.' }

      - name: Require evidence JSON
        if: always()
        shell: pwsh
        run: |
          $json = '_temp\phase3a-ci-evidence\retouch-phase3-electron-acceptance.json'
          if (Test-Path $json) {
            Get-Content $json -Raw | Write-Host
          } else {
            Write-Host 'Evidence JSON was not produced.'
          }
          foreach ($diagnostic in @('_temp\phase3a-ci-evidence\startup-trace.log', '_temp\phase3a-ci-evidence\electron.log')) {
            if (Test-Path $diagnostic) {
              Write-Host "=== $diagnostic ==="
              Get-Content $diagnostic -Tail 200 | Write-Host
            }
          }

      - name: Upload Phase 3A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3a-electron-acceptance-${{ github.sha }}
          path: _temp/phase3a-ci-evidence/
          if-no-files-found: warn
          retention-days: 7
