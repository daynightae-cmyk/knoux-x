name: Temporary Video Studio Paid Confirmation

on:
  push:
    branches:
      - codex/video-studio-provider-truth-20260908

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply paid-confirmation source patch
        run: node tools/temporary-video-paid-confirmation-patch.cjs
      - name: Commit source patch
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/video-studio/VideoStudioView.tsx src/locales/videoStudio.ts
          git commit -m "fix(video): require explicit paid-generation confirmation"
          git push origin HEAD:${{ github.ref_name }}
