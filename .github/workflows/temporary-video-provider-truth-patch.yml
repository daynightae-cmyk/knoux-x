name: Temporary Video Studio Truth Wiring

on:
  push:
    branches:
      - codex/video-studio-provider-truth-20260908

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply source patch
        run: node tools/temporary-video-provider-truth-patch.cjs
      - name: Commit source patch
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add electron/video-studio/video-studio-service.ts src/core/video-studio/ai/video-catalog.ts src/core/video-studio/ai/video-router.ts tests/unit/video-studio-ai.test.ts
          git commit -m "fix(video): enforce executable provider truth"
          git push origin HEAD:${{ github.ref_name }}
