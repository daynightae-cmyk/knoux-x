name: KNOUX Professional Suite Source Repair

on:
  push:
    branches:
      - codex/knoux-professional-media-suite-completion
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: professional-suite-source-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/knoux-professional-media-suite-completion
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2

      - name: Validate historical source repairs are committed
        run: |
          node tools/repair-professional-suite-source.cjs
          git diff --exit-code
