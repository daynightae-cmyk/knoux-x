<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https:;" />

  <title>Knoux X</title>
  <meta name="description" content="Knoux X premium local-first media player and creative studio" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/assets/icons/favicon.png" />

  <style>
    /* Critical first-paint CSS. It deliberately matches the Daylight default so
       browser/Electron startup never flashes the retired dark/cyan identity. */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #f8f7fc;
      color: #15121c;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      color-scheme: light;
    }

    #root {
      width: 100vw;
      height: 100vh;
    }

    .initial-loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 44%, rgba(139, 61, 255, 0.14), transparent 23%),
        radial-gradient(circle at 16% 18%, rgba(196, 166, 255, 0.24), transparent 26%),
        linear-gradient(155deg, #ffffff 0%, #f8f7fc 48%, #eee8ff 100%);
      z-index: 9999;
      transition: opacity 160ms ease, visibility 160ms step-end;
    }

    .initial-loading.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(120, 40, 232, 0.14);
      border-top-color: #7828e8;
      border-radius: 50%;
      box-shadow: 0 0 24px rgba(139, 61, 255, 0.16);
      animation: spin 760ms linear infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .loading-spinner {
        animation-duration: 1800ms;
      }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="initial-loading" class="initial-loading" aria-hidden="true">
    <div class="loading-spinner"></div>
  </div>

  <div id="root"></div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const loading = document.getElementById('initial-loading');
      if (loading) {
        loading.classList.add('hidden');
      }
    });
  </script>

  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
