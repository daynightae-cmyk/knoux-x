<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https:;" />

  <title>Knoux X</title>
  <meta name="description" content="Knoux X premium local-first media player and creative studio" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/assets/icons/favicon.png" />

  <style>
    /* Critical first-paint CSS. The desktop and browser editions keep the
       daylight first paint they have always used. Android runs the cinema-dark
       identity, so the inline runtime probe below switches the very first
       frame to the native splash background and never flashes a light surface
       between the native splash and the React overlay. */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #f8f7fc;
      color: #15121c;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      color-scheme: light;
    }

    html[data-runtime='android'],
    html[data-runtime='android'] body {
      background: #08060d;
      color: #fbfaff;
      color-scheme: dark;
    }

    #root {
      width: 100vw;
      height: 100vh;
    }

    .initial-loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 44%, rgba(139, 61, 255, 0.14), transparent 23%),
        radial-gradient(circle at 16% 18%, rgba(196, 166, 255, 0.24), transparent 26%),
        linear-gradient(155deg, #ffffff 0%, #f8f7fc 48%, #eee8ff 100%);
      z-index: 9999;
      transition: opacity 160ms ease, visibility 160ms step-end;
    }

    html[data-runtime='android'] .initial-loading {
      background:
        radial-gradient(circle at 50% 34%, rgba(139, 61, 255, 0.32), transparent 28%),
        radial-gradient(circle at 18% 18%, rgba(191, 90, 255, 0.22), transparent 22%),
        radial-gradient(circle at 84% 84%, rgba(139, 61, 255, 0.18), transparent 24%),
        linear-gradient(155deg, #08060d 0%, #0e1015 48%, #151023 100%);
    }

    .initial-loading.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(120, 40, 232, 0.14);
      border-top-color: #7828e8;
      border-radius: 50%;
      box-shadow: 0 0 24px rgba(139, 61, 255, 0.16);
      animation: spin 760ms linear infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .loading-spinner {
        animation-duration: 1800ms;
      }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- Capacitor injects its native bridge immediately after <head>, so the
       platform is already known when this runs. Marking the runtime before the
       body paints keeps the Android first frame on the cinema-dark surface
       without changing the desktop first paint. -->
  <script>
    try {
      if (window.Capacitor && typeof window.Capacitor.getPlatform === 'function' && window.Capacitor.getPlatform() === 'android') {
        document.documentElement.setAttribute('data-runtime', 'android');
      }
    } catch (error) {
      // A missing native bridge simply keeps the default first paint.
    }
  </script>
</head>
<body>
  <div id="initial-loading" class="initial-loading" aria-hidden="true">
    <div class="loading-spinner"></div>
  </div>

  <div id="root"></div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const loading = document.getElementById('initial-loading');
      if (loading) {
        loading.classList.add('hidden');
      }
    });
  </script>

  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
