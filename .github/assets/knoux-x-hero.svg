    <text x="69" y="316" font-family="Arial,Helvetica,sans-serif" fill="#ECE2FA" font-size="31" font-weight="500" letter-spacing="5">CREATE · PLAY · ENHANCE</text>
    <text x="70" y="353" font-family="Arial,Helvetica,sans-serif" fill="#AFA0CD" font-size="17" letter-spacing="1">A cinematic workspace for media, editing and imagination.</text>
